<head>

<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">

<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Spectral:ital,wght@0,400;0,600;0,700;1,500&family=IBM+Plex+Sans:wght@400;500;600&display=swap">
<style>
/* Sapphire brand (approved Case Challenge template): navy, gold, grid paper, Spectral + IBM Plex Sans.
   Taste house rules: flat fills, tone steps instead of lines and shadows, no eyebrows, no monospace.
   The masthead globe is the one live thing: its seven coins are the seven tasks and light up as they are completed. */
:root{
  --bg:#e9eef4; --grid:rgba(11,37,69,.055); --surface:#ffffff; --surface-2:#f1f5f9; --surface-3:#e3eaf2;
  --ink:#0d1c31; --muted:#4f6079; --line-strong:#b9c6d6;
  --navy:#0b2545; --navy-2:#13345f; --navy-ink:#f3f6fb; --navy-muted:#b4c3d7; --accent:#0f2f57; --accent-ink:#ffffff;
  --gold:#c9a24a; --gold-ink:#7a5c17; --gold-soft:#f3ead6;
  --ok:#2c7a57; --ok-soft:#dcefe5; --bad:#a8461c; --warn:#a8671c; --warn-soft:#f5e6d3;
  --f-display:"Spectral",Georgia,"Times New Roman",serif;
  --f-body:"IBM Plex Sans",system-ui,-apple-system,"Segoe UI",sans-serif;
  color-scheme:light;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#050b16; --grid:rgba(226,192,109,.055); --surface:#0b1527; --surface-2:#10203a; --surface-3:#162a48;
  --ink:#e7ecf3; --muted:#a3b2c6; --line-strong:#2b3d5b;
  --navy:#081a33; --navy-2:#102b4f; --navy-ink:#f1f4f9; --navy-muted:#a3b4cc; --accent:#9cbde6; --accent-ink:#06101f;
  --gold:#e2c06d; --gold-ink:#e2c06d; --gold-soft:#2a2614;
  --ok:#6fcf9f; --ok-soft:#12301f; --bad:#ef8a6d; --warn:#e8b067; --warn-soft:#33240f; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#050b16; --grid:rgba(226,192,109,.055); --surface:#0b1527; --surface-2:#10203a; --surface-3:#162a48;
  --ink:#e7ecf3; --muted:#a3b2c6; --line-strong:#2b3d5b;
  --navy:#081a33; --navy-2:#102b4f; --navy-ink:#f1f4f9; --navy-muted:#a3b4cc; --accent:#9cbde6; --accent-ink:#06101f;
  --gold:#e2c06d; --gold-ink:#e2c06d; --gold-soft:#2a2614;
  --ok:#6fcf9f; --ok-soft:#12301f; --bad:#ef8a6d; --warn:#e8b067; --warn-soft:#33240f; color-scheme:dark}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{margin:0}
/* Grid paper is part of the Sapphire brand. taste-skill-ignore */
body{background-color:var(--bg);background-image:linear-gradient(var(--grid) 1px,transparent 1px),linear-gradient(90deg,var(--grid) 1px,transparent 1px);background-size:28px 28px; /* taste-skill-ignore */
  color:var(--ink);font:16px/1.55 var(--f-body);-webkit-font-smoothing:antialiased;padding-bottom:80px}
.gut{padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.wrap{max-width:880px;margin:0 auto;display:grid;gap:24px}
.wide{max-width:1200px}
.tnum{font-variant-numeric:tabular-nums}
/* Masthead */
.mast{position:relative;overflow:hidden;background:var(--navy);color:var(--navy-ink);border-bottom:3px double var(--gold);padding-block:40px 34px;isolation:isolate}
.mast.compact{padding-block:18px 16px}
.mast.compact h1{font-size:clamp(24px,3vw,34px);letter-spacing:-.01em}
.mast.compact .sub{display:none}
.mast.compact .tools{margin-top:4px}
.mast canvas{position:absolute;top:0;bottom:0;right:0;left:auto;width:min(100%,760px);height:100%;z-index:-1}
.mast.compact canvas{width:min(100%,380px)}
.mast .wrap{gap:10px;justify-items:start}
.mast h1{font-family:var(--f-display);font-weight:700;font-size:clamp(36px,6.4vw,76px);line-height:.98;letter-spacing:-.02em;margin:0;text-wrap:balance}
.mast h1 em{font-style:italic;font-weight:500;color:var(--gold)} /* brand accent word from the approved template */
.mast .sub{margin:0;max-width:46ch;color:var(--navy-muted);font-size:17px}
.mast .tools{display:flex;gap:8px;flex-wrap:wrap;margin-top:8px}
.chip{display:inline-flex;align-items:center;gap:8px;border:0;background:var(--navy-2);color:var(--navy-ink);border-radius:999px;padding:8px 14px;font:500 14px var(--f-body)}
button.chip{cursor:pointer;transition:background .2s,color .2s} button.chip:hover{background:var(--gold);color:#0b2545}
.progress{color:var(--navy-ink)} .progress b{color:var(--gold);font-weight:600}
main{margin-top:28px}
h2{font:600 clamp(26px,3.4vw,34px)/1.1 var(--f-display);margin:0;letter-spacing:-.01em;text-wrap:balance}
h3{font:600 18px/1.3 var(--f-display);margin:0}
.muted{color:var(--muted)}
p{max-width:65ch}
.poster{position:relative;display:block;width:100%;aspect-ratio:16/9;padding:0;border:0;border-radius:0;background:#000 center/cover no-repeat;cursor:pointer;overflow:hidden}
.poster img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;transition:transform .8s cubic-bezier(.2,.7,.2,1)}
.poster:hover img{transform:scale(1.04)}
.poster .play{position:absolute;left:24px;bottom:24px;display:inline-flex;align-items:center;gap:10px;background:var(--gold);color:#0b2545;font:600 16px var(--f-body);padding:12px 18px;border-radius:999px;transition:transform .2s}
.poster:hover .play{transform:translateY(-2px)}
.poster .play::before{content:"";width:0;height:0;border-left:12px solid #0b2545;border-top:8px solid transparent;border-bottom:8px solid transparent}
.pts{color:var(--gold-ink);font-weight:600}
.card{background:var(--surface);border-radius:4px;padding:28px;display:grid;gap:18px;min-width:0;border-top:3px solid var(--gold);transition:transform .35s cubic-bezier(.2,.7,.2,1)}
.tilt{transform-style:preserve-3d;will-change:transform}
.grid2{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:14px}
label.f{display:grid;gap:6px;font-weight:500;font-size:14px;color:var(--ink)}
input[type=text],input[type=number],input[type=password],select,textarea{font:inherit;color:var(--ink);background:var(--surface-2);border:1px solid var(--line-strong);border-radius:4px;padding:11px 12px;width:100%;transition:border-color .2s,background .2s}
input:focus,select:focus,textarea:focus{outline:2px solid var(--gold);outline-offset:1px;border-color:var(--gold)}
select.inl{width:auto;display:inline-block;padding:4px 8px;margin:0 4px}
textarea{min-height:150px;resize:vertical}
button:focus-visible{outline:2px solid var(--gold);outline-offset:2px}
button{font:600 15px var(--f-body);border-radius:4px;padding:12px 20px;border:0;background:var(--navy);color:var(--navy-ink);cursor:pointer;transition:background .2s,color .2s,transform .12s}
button:hover:not(:disabled){background:var(--gold);color:#0b2545}
button:active:not(:disabled){transform:scale(.97)}
:root[data-theme="dark"] button:not(.ghost):not(.chip):not(.tabs button):not(.poster){background:var(--gold);color:#0b2545}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) button:not(.ghost):not(.chip):not(.tabs button):not(.poster){background:var(--gold);color:#0b2545}}
:root[data-theme="dark"] button:not(.ghost):not(.chip):not(.tabs button):not(.poster):hover:not(:disabled){background:var(--navy-ink)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) button:not(.ghost):not(.chip):not(.tabs button):not(.poster):hover:not(:disabled){background:var(--navy-ink)}}
button.ghost{background:var(--surface-3);color:var(--ink)}
button:disabled{opacity:.45;cursor:not-allowed}
.row{display:flex;flex-wrap:wrap;gap:12px;align-items:center}
.tabs{display:flex;flex-wrap:wrap;gap:4px;min-width:0;flex:1}
.tabs::-webkit-scrollbar{display:none}
.tabs button{flex:none;background:none;color:var(--muted);border-radius:999px;padding:8px 14px;font-weight:500;font-size:14px;display:inline-flex;align-items:center;gap:8px}
.tabs button:hover:not(:disabled){color:var(--ink);background:var(--surface-3)}
.tabs button[aria-current="true"]{background:var(--accent);color:var(--accent-ink)}
.tabs .tn::after{content:"."}
.tabs .tn{margin-right:-4px}
@media (max-width:700px){.tabs .tt{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}.tabs .tn::after{content:""}.tabs .tn{margin-right:0}.tabs button{padding:8px 11px}}
.tabs .pip{width:8px;height:8px;border-radius:50%;background:var(--line-strong);transition:background .3s,transform .3s}
.tabs .pip.done{background:var(--gold);transform:scale(1.25)}
.q{display:grid;gap:10px;padding-top:6px}
.qn{color:var(--gold-ink);font-weight:600}
.opts{display:grid;gap:6px}
.opts label{display:flex;gap:10px;align-items:flex-start;cursor:pointer;padding:10px 12px;border-radius:4px;background:var(--surface-2);transition:background .2s}
.opts label:hover{background:var(--surface-3)}
.opts label:has(input:checked){background:var(--gold-soft)}
.opts input{accent-color:var(--navy);margin-top:5px}
.text{background:var(--surface-2);border-left:4px solid var(--gold);border-radius:0 4px 4px 0;padding:18px 22px;max-width:72ch;font-family:var(--f-display);font-size:18px;line-height:1.7}
.bar{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--bg);padding-block:10px;display:flex;flex-wrap:nowrap;gap:10px;align-items:flex-start;justify-content:space-between;box-shadow:0 8px 16px -14px rgba(11,37,69,.5)} /* sticky bar floats over content. taste-skill-ignore */
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--bg)}
.timer{font-weight:600;font-size:16px;font-variant-numeric:tabular-nums;background:var(--surface);border-radius:999px;padding:7px 14px;white-space:nowrap}
.timer.low{background:var(--warn-soft);color:var(--bad)}
.note{border-left:4px solid var(--gold);padding:12px 16px;background:var(--gold-soft);border-radius:0 4px 4px 0;font-size:15px}
.err{border-left-color:var(--bad);background:var(--warn-soft)}
.video{position:relative;width:100%;max-width:100%;aspect-ratio:16/9;background:#000;overflow:hidden}
.video iframe{position:absolute;inset:0;width:100%;height:100%;border:0}
table{border-collapse:collapse;width:100%;font-size:14px}
th,td{padding:10px;border-bottom:1px solid var(--surface-3);text-align:left;vertical-align:top}
th{font:600 13px var(--f-body);color:var(--muted);white-space:nowrap;border-bottom:2px solid var(--gold)}
tr:hover td{background:var(--surface-2)}
td.num,th.num{text-align:right;font-variant-numeric:tabular-nums}
.scroll{overflow-x:auto}
.pill{display:inline-block;font:600 12px var(--f-body);padding:4px 10px;border-radius:999px;white-space:nowrap}
.pill.ok{color:var(--ok);background:var(--ok-soft)} .pill.bad{color:var(--bad);background:var(--warn-soft)} .pill.wait{color:var(--warn);background:var(--warn-soft)}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:12px}
.stat{border-radius:4px;padding:16px 18px;background:var(--surface)}
.stat b{display:block;font:700 40px/1 var(--f-display);font-variant-numeric:tabular-nums;color:var(--ink);margin-bottom:6px}
.stat span{font-size:14px;color:var(--muted)}
details summary{cursor:pointer;color:var(--accent);font-weight:500}
.answers{font-size:14px;display:grid;gap:4px;margin-top:8px}
.essay{white-space:pre-wrap;background:var(--surface-2);padding:12px;border-radius:4px;max-width:68ch;font-size:15px}
.oscore{width:72px}
.gaps p{margin:0 0 12px;line-height:2.25}
input.gap{width:9.5em;display:inline-block;padding:3px 8px;margin:0 2px;font-family:var(--f-body);font-size:15px}
.gaps select.inl{font-family:var(--f-body);font-size:15px}
.gn{font-size:11px;font-weight:600;color:var(--gold-ink);margin-left:2px;font-family:var(--f-body)}
.hint{color:var(--muted);font-style:italic}
.person{display:grid;gap:6px;padding:16px 18px;border-radius:4px;background:var(--surface-2)}
.person p{margin:0;max-width:72ch}
/* Entrance: parts of a section rise in turn. Content is visible even if animation never runs. */
@keyframes rise{from{opacity:0;transform:translateY(22px)}to{opacity:1;transform:none}}
.card>*{animation:rise .55s cubic-bezier(.2,.7,.2,1) both}
.card>*:nth-child(2){animation-delay:.07s}.card>*:nth-child(3){animation-delay:.14s}.card>*:nth-child(4){animation-delay:.21s}.card>*:nth-child(n+5){animation-delay:.28s}
.mast .wrap>*{animation:rise .7s cubic-bezier(.2,.7,.2,1) both}.mast .wrap>*:nth-child(2){animation-delay:.08s}.mast .wrap>*:nth-child(3){animation-delay:.16s}
@media (max-width:520px){.mast{padding-block:22px 20px}.mast .sub{font-size:15px}.card{padding:20px}.text{font-size:17px;padding:16px}}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style>
</head>
<body>
<header class="mast gut">
  <canvas id="scene" aria-hidden="true"></canvas>
  <div class="wrap">
    <h1>Business English <em>Olympiad</em></h1>
    <p class="sub">English Language Week for future economists. Seven tasks, seven coins on the globe: each one turns gold when its task is done.</p>
    <div class="tools">
      <span class="chip" id="who"></span>
      <span class="chip progress tnum" id="progress" hidden></span>
      <button type="button" class="chip" id="themeBtn" aria-label="Switch light or dark theme"><span id="themeLbl">Dark</span></button>
    </div>
  </div>
</header>
<div id="app" class="wrap gut">
  <main id="main"></main>
</div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script src="config.js"></script>
<script>
/* ============================ CONTENT ============================
   Ключи ответов хранятся только в Supabase (таблица olymp_settings), здесь их нет.
   В текстах [[n|подсказка]] обозначает пропуск n (нумерация с 1). */
const CFG = window.OLYMPIAD_CONFIG || {};
const ART = ["a","an","the","-"];
const SECTIONS = [
 { id:"T", title:"1. Tenses", each:1, n:12, kind:"type",
   intro:"Put the verbs in brackets into the correct form.",
   text:"Dear Anna,\n\nThank you for your email. I [[1|receive]] it yesterday, but I [[2|be]] at a trade fair all day, so I couldn't reply. At the moment our team [[3|prepare]] the annual report, and it [[4|finish]] by Friday. Since January our sales [[5|grow]] by 12 per cent.\n\nLast month we [[6|sign]] a contract with a new supplier from Poland. Their goods are cheaper because they [[7|produce]] in a small town where costs are low. When I [[8|visit]] their factory, the workers [[9|load]] a lorry with our order.\n\nIf you [[10|have]] any questions, please call me. I [[11|send]] you the new figures as soon as I get them. I look forward to [[12|hear]] from you.\n\nBest regards,\nPeter" },
 { id:"R", title:"2. Articles", each:1, n:10, kind:"select", opts:ART,
   intro:"Fill the gaps with a / an / the or – (no article).",
   text:"[[1]] small company from Kazan has opened [[2]] online shop. [[3]] shop sells [[4]] tea and coffee at low prices. [[5]] owner, Marat Ilyin, is [[6]] economist by education. He says that [[7]] internet helped him find customers all over [[8]] Russia. Last year [[9]] number of orders doubled, and now he wants to open [[10]] office in Moscow." },
 { id:"C", title:"3. Lexis", each:1, n:10, kind:"type",
   intro:"Read the text and fill each gap with ONE word.",
   text:"Today more and more people pay [[1]] their purchases with a smartphone. This is convenient because you do not need to carry cash [[2]] you. Many small shops have also started [[3]] accept card payments. However, not everyone is happy [[4]] this change. Older people, [[5]] example, often prefer to use cash. Some experts say that cash is safer [[6]] digital money because it cannot be hacked. [[7]] the other hand, digital payments are faster and cheaper for businesses, [[8]] is why banks support them. In the future, cash may disappear completely, [[9]] it is difficult to say when. Whatever happens, we will all have [[10]] learn new ways of managing our money." },
 { id:"M", title:"4. Word choice", each:1, n:10, kind:"select",
   intro:"Complete the passage by choosing the word which best fits each gap.",
   opts:[["dreamed","thought","wondered","hoped"],["set","took","made","put"],["make","do","get","keep"],["high","tall","long","deep"],["take","make","borrow","lend"],["spent","paid","invested","bought"],["willing","wanting","agreeing","liking"],["employed","occupied","worked","used"],["pays","costs","earns","gives"],["on","over","at","in"]],
   text:"Anna had always [[1]] of running her own business. After college she [[2]] up a small bakery in her home town. At first it was hard to [[3]] ends meet because the rent was very [[4]]. She decided to [[5]] out a bank loan and [[6]] the money in a new oven. Soon her bread became popular, and customers were [[7]] to pay more for quality. Two years later she opened a second shop and [[8]] five new people. Her story shows that hard work really [[9]] off. Today Anna is [[10]] the moon about her results." },
 { id:"W", title:"5. Word formation", each:1, n:10, kind:"type",
   intro:"Use the word in brackets to form a word that fits the gap.",
   text:"Igor Petrov is one of the most [[1|SUCCESS]] young businessmen in our city. Five years ago the [[2|MANAGE]] of a large factory refused his plan, saying it was completely [[3|REAL]]. Igor made a quick [[4|DECIDE]] and started his own firm. Its sales rose [[5|DRAMATIC]] in the first year. The [[6|GROW]] of online trade helped him a lot. Igor knows that many young people face [[7|EMPLOY]] after college, so he hires graduates. He also works with a financial [[8|ADVISE]], because customers expect [[9|RELY]] service and stable prices. Now he spends money on the [[10|DEVELOP]] of new products." },
 { id:"P", title:"6. Reading: careers", each:1, n:10, kind:"match",
   intro:"Read about five people and their careers in economics. For questions 1–10, choose from the people A–E. The people may be chosen more than once.",
   people:[
    ["A","Olga, accountant","I chose accounting because my father, who is an accountant himself, told me it was a stable job. At first I was terrible at using the accounting software and made lots of mistakes, but my colleagues were patient with me. Now I work long hours during the tax season, so in spring I rarely see my friends."],
    ["B","Daniel, logistics specialist","After college I moved to Germany to work for a large logistics company. I noticed that our drivers wasted hours waiting at warehouses, so I suggested a new booking system for deliveries. My manager accepted the idea, and now the drivers finish work much earlier."],
    ["C","Irina, bank employee","I never planned to work in a bank. I wanted to be a journalist, but journalists' pay is often unpredictable, so I took a job as a bank clerk to have a regular salary. I enjoy talking to clients, and last year I became a customer service manager."],
    ["D","Pavel, online seller","I learnt everything about online sales from videos and books, and I have never taken a business course. I started by selling phone cases from my flat. Thanks to good reviews from my first customers, more and more people trust my shop, and now I'm hiring two assistants."],
    ["E","Maria, junior auditor","Many of my friends went to university, but I believe practical experience is more valuable than lectures. That's why I joined an audit firm as an intern straight after college. I asked my boss to let me check a real client's documents, and he was so impressed with my work that he offered me a permanent contract."]],
   qs:["Which person changed their career plans because they wanted a steady income?","Which person admits they were not good at one part of their job at first?","Which person benefited from showing what they could do?","Which person made a suggestion that improved colleagues' working conditions?","Which person thinks work experience is better than higher education?","Which person went abroad to work?","Which person followed a parent's advice?","Which person is self-taught in their field?","Which person used their good reputation to grow their business?","Which person has a limited social life at a certain time of year?"] },
 { id:"A", title:"7. Listening", each:2, kind:"mcq",
   intro:"Watch the video (you may watch it twice) and answer the questions. The answers are not said word for word in the video, so think about what you hear.",
   qs:[
    {t:"Why does the narrator mention that there are no rivers near Stonehenge?", o:["To explain why it was easy to bring the stones.","To show that the choice of the place is a puzzle.","To prove that the builders came from Wales."]},
    {t:"Ian says that about 6,000 people come on an average summer day and over a million people visit in a year. What can we conclude?", o:["The site gets the same number of visitors every day.","There are far fewer visitors per day outside the summer.","Most visitors come in winter."]},
    {t:"Compare the ditch and bank with the stone monument. The ditch and bank are…", o:["about 500 years younger.","the same age.","about 500 years older."]},
    {t:"How do researchers know where the builders lived?", o:["They found remains of huts at Durrington Walls.","They read written records of that time.","They studied the stone tools inside the monument."]},
    {t:"Compare the journeys of the two types of stone. Which statement is correct?", o:["The bluestones came a shorter distance than the sarsen stones.","Both types of stone came from Wales.","The bluestones travelled about ten times farther than the sarsen stones."]},
    {t:"About a hundred men were probably needed to pull one sarsen stone. What does this suggest about the people who built Stonehenge?", o:["The work was done by a few specialists.","They could organise a large number of workers.","They used machines to move the stones."]},
    {t:"Which of these does Ian present as known for sure, not as a theory?", o:["The monument is aligned with the summer and winter solstices.","It was built by people from another planet.","It was a monument to the ancestors."]},
    {t:"What is the main idea of the end of the video?", o:["New technology shows the site is more complex than people thought.","Scientists now know everything about Stonehenge.","The stones under the ground were added recently."]}
   ],
   open:{t:"Stonehenge receives more than a million visitors a year. Imagine you are an economist. Name two ways the monument benefits the local economy and one problem that mass tourism can cause. Write 40–60 words.", max:4} }
];
SECTIONS.forEach(s=>{ if(!s.n) s.n=s.qs.length; });

/* ============================ HELPERS ============================ */
const $ = s => document.querySelector(s);
const el = (tag, attrs={}, ...kids) => { const e=document.createElement(tag);
  for (const [k,v] of Object.entries(attrs)) { if (k==="class") e.className=v; else if (k==="text") e.textContent=v; else if (k.startsWith("on")) e.addEventListener(k.slice(2),v); else if (v!==false && v!=null) e.setAttribute(k,v===true?"":v); }
  for (const k of kids) if (k!=null) e.append(k); return e; };
const words = s => (s||"").trim().split(/\s+/).filter(Boolean).length;
const fmtTime = ms => { const s=Math.max(0,Math.floor(ms/1000)); return String(Math.floor(s/60)).padStart(2,"0")+":"+String(s%60).padStart(2,"0"); };

    while((m=re.exec(par))){ p.append(par.slice(last,m.index)); const i=Number(m[1])-1;
      p.append(el("sup",{class:"gn",text:m[1]}));
      if (sec.kind==="type"){ const inp=el("input",{type:"text",class:"gap",id:`${sec.id}${i}`,"aria-label":`Gap ${m[1]}`,autocomplete:"off",autocapitalize:"off",spellcheck:"false",value:cur(sec.id,i)});

  g.add(new THREE.Mesh(new THREE.SphereGeometry(2.05,48,32), new THREE.MeshStandardMaterial({color:0x0f2f57,metalness:.6,roughness:.35,transparent:true,opacity:.55})));
  g.add(new THREE.LineSegments(new THREE.EdgesGeometry(new THREE.IcosahedronGeometry(2.15,2)), new THREE.LineBasicMaterial({color:GOLD,transparent:true,opacity:.55})));
  // Latitude lines
  for(let i=-2;i<=2;i++){ const r=Math.sqrt(2.18*2.18-(i*.75)**2); const ring=new THREE.Mesh(new THREE.TorusGeometry(r,.006,6,128), new THREE.MeshBasicMaterial({color:PALE,transparent:true,opacity:.22})); ring.rotation.x=Math.PI/2; ring.position.y=i*.75; g.add(ring); }
  // Seven coins = seven tasks. Pale until the task is done, then gold. Click a coin to open its task.
  const orbits=[[3.1,.35,0],[3.6,-.5,.8],[4.1,.15,2.1]].map(([R,tilt],k)=>{
    const o=new THREE.Group(); o.rotation.x=Math.PI/2+tilt; o.rotation.y=tilt*.6;
    o.add(new THREE.Mesh(new THREE.TorusGeometry(R,.01,6,200), new THREE.MeshBasicMaterial({color:GOLD,transparent:true,opacity:.3})));
    g.add(o); return {o,R,speed:.22+k*.07}; });
  const coinGeo=new THREE.CylinderGeometry(.34,.34,.06,40);
  const coins=SECTIONS.map((sec,i)=>{ const orb=orbits[i%3];
    const m=new THREE.Mesh(coinGeo,new THREE.MeshStandardMaterial({color:0x6f86a6,metalness:.6,roughness:.45,emissive:0x000000}));
    m.userData={id:sec.id,orb,phase:(i/SECTIONS.length)*Math.PI*2+ (i%3),done:false,pulse:0}; orb.o.add(m); return m; });
  window.setCoins = done => { coins.forEach((m,i)=>{ const d=!!done[i]; if(d&&!m.userData.done) m.userData.pulse=1;
    m.userData.done=d; m.material.color.setHex(d?GOLD:0x6f86a6); m.material.metalness=d?.95:.6; m.material.roughness=d?.22:.45; m.material.emissive.setHex(d?0x6a4c0a:0x000000); }); if(reduceMotion) renderer.render(scene,cam); };
  const ray=new THREE.Raycaster(), ptr=new THREE.Vector2();
  function hitCoin(e){ const r=c.getBoundingClientRect(); if(e.clientY>r.bottom||e.clientY<r.top) return null;
    ptr.set(((e.clientX-r.left)/r.width)*2-1, -((e.clientY-r.top)/r.height)*2+1); ray.setFromCamera(ptr,cam);
    const h=ray.intersectObjects(coins,false)[0]; return h?h.object:null; }
  const mast=c.parentElement;
  mast.addEventListener("pointermove",e=>{ mast.style.cursor = (rec&&rec.status!=="submitted"&&hitCoin(e))?"pointer":""; });
  mast.addEventListener("click",e=>{ if(!rec||rec.status==="submitted"||typeof go!=="function") return; const m=hitCoin(e); if(m) go(m.userData.id); });
  // Star dust
  const N=260, pos=new Float32Array(N*3); for(let i=0;i<N;i++){ pos[i*3]=(Math.random()-.5)*26; pos[i*3+1]=(Math.random()-.5)*10; pos[i*3+2]=(Math.random()-.5)*8-3; }
  const dust=new THREE.BufferGeometry(); dust.setAttribute("position",new THREE.BufferAttribute(pos,3));
  scene.add(new THREE.Points(dust,new THREE.PointsMaterial({color:GOLD,size:.035,transparent:true,opacity:.6})));
  let tx=0,ty=0;
  addEventListener("pointermove",e=>{ tx=(e.clientX/innerWidth-.5); ty=(e.clientY/innerHeight-.5); },{passive:true});
  function size(){ const w=c.clientWidth,h=c.clientHeight; if(!w||!h) return; renderer.setSize(w,h,false); cam.aspect=w/h; cam.updateProjectionMatrix();
    // The canvas is its own box on the right, so the globe always sits in the middle of a normal frame (no edge distortion).
    const compact=c.parentElement.classList.contains("compact"), narrow=w<600;
    g.position.set(0, compact?0:(narrow?-.2:0), 0); g.scale.setScalar(compact?.85:(narrow?.75:1));
    c.style.opacity = innerWidth<700 ? ".35" : ".95"; }
  addEventListener("resize",size); size(); new ResizeObserver(size).observe(c);
  const t0=performance.now();
  function frame(now){ const t=(now-t0)/1000;
    g.rotation.y = t*.12 + tx*.5; g.rotation.x += ((ty*.35)-g.rotation.x)*.05;
    coins.forEach(m=>{ const u=m.userData, a=t*u.orb.speed+u.phase; m.position.set(Math.cos(a)*u.orb.R,Math.sin(a)*u.orb.R,0); m.rotation.x=t*1.5; m.rotation.z=a;
      if(u.pulse>0){ u.pulse=Math.max(0,u.pulse-.02); } m.scale.setScalar(1+Math.sin(u.pulse*Math.PI)*.9); });
    renderer.render(scene,cam); if(!reduceMotion) requestAnimationFrame(frame); }
  if (rec) updateProgress();
  requestAnimationFrame(frame);
})();

if (!reduceMotion && matchMedia("(pointer:fine)").matches){
  document.addEventListener("pointermove",e=>{ const el=e.target.closest?.(".tilt"); document.querySelectorAll(".tilt").forEach(t=>{ if(t!==el) t.style.transform=""; });
    if(!el) return; const r=el.getBoundingClientRect(); const x=(e.clientX-r.left)/r.width-.5, y=(e.clientY-r.top)/r.height-.5;
    el.style.transform=`perspective(1200px) rotateX(${(-y*3).toFixed(2)}deg) rotateY(${(x*3).toFixed(2)}deg) translateY(-2px)`; },{passive:true});
}

if ("serviceWorker" in navigator && location.protocol.startsWith("http")) navigator.serviceWorker.register("sw.js").catch(()=>{});
if (location.hash.startsWith("#teacher")) renderTeacherLogin(); else bootStudent();
const startedAsTeacher = location.hash.startsWith("#teacher");
addEventListener("hashchange", ()=>{ if (location.hash.startsWith("#teacher=") || location.hash.startsWith("#teacher")!==startedAsTeacher) location.reload(); });
</script>
