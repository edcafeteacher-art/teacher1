<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Олимпиада Business English</title>
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#0f5e63">
<link rel="icon" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Olympiad">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Unbounded:wght@500;700&family=Golos+Text:wght@400;500;600&family=JetBrains+Mono:wght@400;600&display=swap">
<style>
/* Layout: narrow exam column for students, wide ledger for the teacher; ink-teal + ochre, like a printed exam booklet. */
:root{
  --bg:#f4f6f5; --paper:#ffffff; --ink:#14232a; --muted:#5b6b70; --line:#d5dddc;
  --accent:#0f5e63; --accent-ink:#ffffff; --ochre:#9a6416; --ok:#2f7d4a; --bad:#b03a2e; --soft:#e6efee;
  --f-display:"Unbounded","Golos Text",system-ui,sans-serif;
  --f-body:"Golos Text",system-ui,-apple-system,"Segoe UI",sans-serif;
  --f-mono:"JetBrains Mono",ui-monospace,Menlo,monospace;
  color-scheme:light;
}
@media (prefers-color-scheme:dark){:root{
  --bg:#0f1719; --paper:#162225; --ink:#e3ecea; --muted:#94a7a8; --line:#2a3b3e;
  --accent:#4fb3b0; --accent-ink:#06201f; --ochre:#e0a64a; --ok:#5cc27e; --bad:#ef7a6d; --soft:#1d3033; color-scheme:dark}}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);color:var(--ink);font:15px/1.55 var(--f-body);
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:20px 60px}
.wrap{max-width:820px;margin:0 auto;display:grid;gap:18px}
.wide{max-width:1200px}
header.top{display:flex;flex-wrap:wrap;gap:12px;align-items:baseline;justify-content:space-between;border-bottom:2px solid var(--ink);padding-bottom:10px}
h1{font:700 clamp(20px,3.4vw,28px)/1.15 var(--f-display);margin:0;text-wrap:balance;letter-spacing:-.01em}
h2{font:600 19px/1.25 var(--f-display);margin:0 0 6px;text-wrap:balance}
h3{font:600 15px/1.3 var(--f-body);margin:6px 0 0}
.eyebrow{font:600 11px/1 var(--f-body);letter-spacing:.12em;text-transform:uppercase;color:var(--ochre)}
.muted{color:var(--muted)}
.card{background:var(--paper);border:1px solid var(--line);border-radius:6px;padding:20px;display:grid;gap:14px;min-width:0}
.grid2{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:12px}
label.f{display:grid;gap:4px;font-weight:500;font-size:14px}
input[type=text],input[type=number],input[type=password],select,textarea{font:inherit;color:var(--ink);background:var(--bg);border:1px solid var(--line);border-radius:4px;padding:9px 10px;width:100%}
select.inl{width:auto;display:inline-block;padding:4px 8px;margin:0 4px}
textarea{min-height:150px;resize:vertical}
input:focus-visible,select:focus-visible,textarea:focus-visible,button:focus-visible{outline:2px solid var(--ochre);outline-offset:2px}
button{font:600 14px var(--f-body);border-radius:4px;padding:10px 16px;border:1px solid var(--accent);background:var(--accent);color:var(--accent-ink);cursor:pointer}
button.ghost{background:transparent;color:var(--accent)}
button:disabled{opacity:.45;cursor:not-allowed}
.row{display:flex;flex-wrap:wrap;gap:10px;align-items:center}
.tabs{display:flex;flex-wrap:wrap;gap:6px}
.tabs button{background:transparent;color:var(--ink);border-color:var(--line);font-weight:500}
.tabs button[aria-current="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.tabs .pts{font:12px var(--f-mono);opacity:.7;margin-left:6px}
.q{display:grid;gap:8px;padding:12px 0;border-top:1px dashed var(--line)}
.q .n{font:600 13px var(--f-mono);color:var(--ochre)}
.opts{display:grid;gap:6px}
.opts label{display:flex;gap:8px;align-items:flex-start;cursor:pointer}
.text{background:var(--soft);border-radius:4px;padding:14px 16px;max-width:68ch}
.bar{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--bg);padding-block:8px;display:flex;flex-wrap:wrap;gap:10px;align-items:center;justify-content:space-between;border-bottom:1px solid var(--line)}
.timer{font:600 18px var(--f-mono);font-variant-numeric:tabular-nums}
.timer.low{color:var(--bad)}
.note{border-left:3px solid var(--ochre);padding:8px 12px;background:var(--soft);border-radius:0 4px 4px 0;font-size:14px}
.err{border-left-color:var(--bad)}
.video{position:relative;width:100%;max-width:100%;aspect-ratio:16/9;background:#000;border-radius:4px;overflow:hidden}
.video iframe{position:absolute;inset:0;width:100%;height:100%;border:0}
table{border-collapse:collapse;width:100%;font-size:14px}
th,td{padding:8px 10px;border-bottom:1px solid var(--line);text-align:left;vertical-align:top}
th{font:600 11px var(--f-body);letter-spacing:.08em;text-transform:uppercase;color:var(--muted);white-space:nowrap}
td.num,th.num{text-align:right;font-family:var(--f-mono);font-variant-numeric:tabular-nums}
.scroll{overflow-x:auto}
.pill{display:inline-block;font:600 11px var(--f-body);letter-spacing:.05em;padding:3px 8px;border-radius:999px;border:1px solid currentColor;white-space:nowrap}
.pill.ok{color:var(--ok)} .pill.bad{color:var(--bad)} .pill.wait{color:var(--ochre)}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px}
.stat{border:1px solid var(--line);border-radius:6px;padding:12px 14px;background:var(--paper)}
.stat b{display:block;font:700 26px var(--f-display);font-variant-numeric:tabular-nums}
.stat span{font-size:12px;color:var(--muted)}
details summary{cursor:pointer;color:var(--accent);font-weight:500}
.answers{font-size:13px;display:grid;gap:4px;margin-top:8px}
.essay{white-space:pre-wrap;background:var(--soft);padding:10px;border-radius:4px;max-width:68ch;font-size:14px}
.oscore{width:72px}
.gaps p{margin:0 0 12px;line-height:2.1}
input.gap{width:9.5em;display:inline-block;padding:3px 6px;margin:0 2px}
.gn{font:600 11px var(--f-mono);color:var(--ochre);margin-left:2px}
.hint{color:var(--muted);font-style:italic}
.person{border-left:3px solid var(--line);padding-left:12px}
.person p{margin:4px 0 0;max-width:68ch}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style>
</head>
<body>
<div id="app" class="wrap">
  <header class="top">
    <div>
      <div class="eyebrow">Неделя английского языка · экономические специальности</div>
      <h1>Business English Olympiad</h1>
    </div>
    <span class="muted" id="who"></span>
  </header>
  <main id="main"></main>
</div>
<script src="config.js"></script>
<script>
/* ============================ CONTENT ============================
   Ключи ответов хранятся только в Supabase (таблица olymp_settings), здесь их нет.
   В текстах [[n|подсказка]] обозначает пропуск n (нумерация с 1). */
const CFG = window.OLYMPIAD_CONFIG || {};
const ART = ["a","an","the","-"];
const SECTIONS = [
 { id:"T", title:"1. Tenses", each:1, n:12, kind:"type",
   intro:"Put the verbs in brackets into the correct form. Раскройте скобки, поставив глагол в нужную форму (время, залог, -ing).",
   text:"Dear Anna,\n\nThank you for your email. I [[1|receive]] it yesterday, but I [[2|be]] at a trade fair all day, so I couldn't reply. At the moment our team [[3|prepare]] the annual report, and it [[4|finish]] by Friday. Since January our sales [[5|grow]] by 12 per cent.\n\nLast month we [[6|sign]] a contract with a new supplier from Poland. Their goods are cheaper because they [[7|produce]] in a small town where costs are low. When I [[8|visit]] their factory, the workers [[9|load]] a lorry with our order.\n\nIf you [[10|have]] any questions, please call me. I [[11|send]] you the new figures as soon as I get them. I look forward to [[12|hear]] from you.\n\nBest regards,\nPeter" },
 { id:"R", title:"2. Articles", each:1, n:10, kind:"select", opts:ART,
   intro:"Fill the gaps with a / an / the or – (no article). Выберите артикль; «-» означает, что артикль не нужен.",
   text:"[[1]] small company from Kazan has opened [[2]] online shop. [[3]] shop sells [[4]] tea and coffee at low prices. [[5]] owner, Marat Ilyin, is [[6]] economist by education. He says that [[7]] internet helped him find customers all over [[8]] Russia. Last year [[9]] number of orders doubled, and now he wants to open [[10]] office in Moscow." },
 { id:"C", title:"3. Open cloze", each:1, n:10, kind:"type",
   intro:"Read the text and fill each gap with ONE word. Впишите в каждый пропуск одно слово.",
   text:"Today more and more people pay [[1]] their purchases with a smartphone. This is convenient because you do not need to carry cash [[2]] you. Many small shops have also started [[3]] accept card payments. However, not everyone is happy [[4]] this change. Older people, [[5]] example, often prefer to use cash. Some experts say that cash is safer [[6]] digital money because it cannot be hacked. [[7]] the other hand, digital payments are faster and cheaper for businesses, [[8]] is why banks support them. In the future, cash may disappear completely, [[9]] it is difficult to say when. Whatever happens, we will all have [[10]] learn new ways of managing our money." },
 { id:"M", title:"4. Word choice", each:1, n:10, kind:"select",
   intro:"Complete the passage by choosing the word which best fits each gap. Выберите слово, которое лучше всего подходит по смыслу и сочетаемости.",
   opts:[["dreamed","thought","wondered","hoped"],["set","took","made","put"],["make","do","get","keep"],["high","tall","long","deep"],["take","make","borrow","lend"],["spent","paid","invested","bought"],["willing","wanting","agreeing","liking"],["employed","occupied","worked","used"],["pays","costs","earns","gives"],["on","over","at","in"]],
   text:"Anna had always [[1]] of running her own business. After college she [[2]] up a small bakery in her home town. At first it was hard to [[3]] ends meet because the rent was very [[4]]. She decided to [[5]] out a bank loan and [[6]] the money in a new oven. Soon her bread became popular, and customers were [[7]] to pay more for quality. Two years later she opened a second shop and [[8]] five new people. Her story shows that hard work really [[9]] off. Today Anna is [[10]] the moon about her results." },
 { id:"W", title:"5. Word formation", each:1, n:10, kind:"type",
   intro:"Use the word in brackets to form a word that fits the gap. Образуйте от слова в скобках однокоренное слово, подходящее по смыслу.",
   text:"Igor Petrov is one of the most [[1|SUCCESS]] young businessmen in our city. Five years ago the [[2|MANAGE]] of a large factory refused his plan, saying it was completely [[3|REAL]]. Igor made a quick [[4|DECIDE]] and started his own firm. Its sales rose [[5|DRAMATIC]] in the first year. The [[6|GROW]] of online trade helped him a lot. Igor knows that many young people face [[7|EMPLOY]] after college, so he hires graduates. He also works with a financial [[8|ADVISE]], because customers expect [[9|RELY]] service and stable prices. Now he spends money on the [[10|DEVELOP]] of new products." },
 { id:"P", title:"6. Reading: careers", each:1, n:10, kind:"match",
   intro:"Read about five people and their careers in economics. For questions 1–10, choose from the people A–E. The people may be chosen more than once.",
   people:[
    ["A","Olga, accountant","I chose accounting because my father, who is an accountant himself, told me it was a stable job. At first I was terrible at using the accounting software and made lots of mistakes, but my colleagues were patient with me. Now I work long hours during the tax season, so in spring I rarely see my friends."],
    ["B","Daniel, logistics specialist","After college I moved to Germany to work for a large logistics company. I noticed that our drivers wasted hours waiting at warehouses, so I suggested a new booking system for deliveries. My manager accepted the idea, and now the drivers finish work much earlier."],
    ["C","Irina, bank employee","I never planned to work in a bank. I wanted to be a journalist, but journalists' pay is often unpredictable, so I took a job as a bank clerk to have a regular salary. I enjoy talking to clients, and last year I became a customer service manager."],
    ["D","Pavel, online seller","I learnt everything about online sales from videos and books, and I have never taken a business course. I started by selling phone cases from my flat. Thanks to good reviews from my first customers, more and more people trust my shop, and now I'm hiring two assistants."],
    ["E","Maria, junior auditor","Many of my friends went to university, but I believe practical experience is more valuable than lectures. That's why I joined an audit firm as an intern straight after college. I asked my boss to let me check a real client's documents, and he was so impressed with my work that he offered me a permanent contract."]],
   qs:["Which person changed their career plans because they wanted a steady income?","Which person admits they were not good at one part of their job at first?","Which person benefited from showing what they could do?","Which person made a suggestion that improved colleagues' working conditions?","Which person thinks work experience is better than higher education?","Which person went abroad to work?","Which person followed a parent's advice?","Which person is self-taught in their field?","Which person used their good reputation to grow their business?","Which person has a limited social life at a certain time of year?"] },
 { id:"A", title:"7. Listening", each:2, kind:"mcq",
   intro:"Посмотрите видео (можно дважды) и ответьте на вопросы. Ответы не звучат в видео дословно, их нужно вывести из услышанного.",
   qs:[
    {t:"Why does the narrator mention that there are no rivers near Stonehenge?", o:["To explain why it was easy to bring the stones.","To show that the choice of the place is a puzzle.","To prove that the builders came from Wales."]},
    {t:"Ian says that about 6,000 people come on an average summer day and over a million people visit in a year. What can we conclude?", o:["The site gets the same number of visitors every day.","There are far fewer visitors per day outside the summer.","Most visitors come in winter."]},
    {t:"Compare the ditch and bank with the stone monument. The ditch and bank are…", o:["about 500 years younger.","the same age.","about 500 years older."]},
    {t:"How do researchers know where the builders lived?", o:["They found remains of huts at Durrington Walls.","They read written records of that time.","They studied the stone tools inside the monument."]},
    {t:"Compare the journeys of the two types of stone. Which statement is correct?", o:["The bluestones came a shorter distance than the sarsen stones.","Both types of stone came from Wales.","The bluestones travelled about ten times farther than the sarsen stones."]},
    {t:"About a hundred men were probably needed to pull one sarsen stone. What does this suggest about the people who built Stonehenge?", o:["The work was done by a few specialists.","They could organise a large number of workers.","They used machines to move the stones."]},
    {t:"Which of these does Ian present as known for sure, not as a theory?", o:["The monument is aligned with the summer and winter solstices.","It was built by people from another planet.","It was a monument to the ancestors."]},
    {t:"What is the main idea of the end of the video?", o:["New technology shows the site is more complex than people thought.","Scientists now know everything about Stonehenge.","The stones under the ground were added recently."]}
   ],
   open:{t:"Stonehenge receives more than a million visitors a year. Imagine you are an economist. Name two ways the monument benefits the local economy and one problem that mass tourism can cause. Write 40–60 words.", max:4} }
];
SECTIONS.forEach(s=>{ if(!s.n) s.n=s.qs.length; });

/* ============================ HELPERS ============================ */
const $ = s => document.querySelector(s);
const el = (tag, attrs={}, ...kids) => { const e=document.createElement(tag);
  for (const [k,v] of Object.entries(attrs)) { if (k==="class") e.className=v; else if (k==="text") e.textContent=v; else if (k.startsWith("on")) e.addEventListener(k.slice(2),v); else if (v!==false && v!=null) e.setAttribute(k,v===true?"":v); }
  for (const k of kids) if (k!=null) e.append(k); return e; };
const words = s => (s||"").trim().split(/\s+/).filter(Boolean).length;
const fmtTime = ms => { const s=Math.max(0,Math.floor(ms/1000)); return String(Math.floor(s/60)).padStart(2,"0")+":"+String(s%60).padStart(2,"0"); };
const store = { get(k){ try{ return JSON.parse(localStorage.getItem(k)); }catch(e){ return null; } }, set(k,v){ try{ localStorage.setItem(k,JSON.stringify(v)); }catch(e){} } };
const configured = () => CFG.SUPABASE_URL && CFG.SUPABASE_ANON_KEY;
async function rpc(fn, body){
  const r = await fetch(`${CFG.SUPABASE_URL.replace(/\/$/,"")}/rest/v1/rpc/${fn}`, { method:"POST",
    headers:Object.assign({ "apikey":CFG.SUPABASE_ANON_KEY, "Content-Type":"application/json" }, CFG.SUPABASE_ANON_KEY.startsWith("eyJ") ? { "Authorization":"Bearer "+CFG.SUPABASE_ANON_KEY } : {}), body:JSON.stringify(body) });
  const txt = await r.text(); const data = txt ? JSON.parse(txt) : null;
  if (!r.ok) throw new Error(data?.message || ("HTTP "+r.status)); return data; }
function ytId(url){ const m=String(url||"").match(/(?:youtu\.be\/|v=|embed\/|shorts\/)([A-Za-z0-9_-]{11})/); return m?m[1]:null; }
const maxOf = sec => sec.n*sec.each + (sec.open?.t ? sec.open.max : 0);
const OPEN_MAX = SECTIONS.reduce((s,x)=>s+(x.open?.t?x.open.max:0),0);
const TOTAL = SECTIONS.reduce((s,x)=>s+maxOf(x),0);
const main = $("#main");

/* ============================ STUDENT ============================ */
let rec=null, current=SECTIONS[0].id, tick=null;
const DRAFT="olymp_draft_v2";

function bootStudent(){
  $("#who").textContent="Участник";
  if (!configured()) main.append(el("div",{class:"note err",text:"Хранилище результатов ещё не подключено (config.js). Сообщите преподавателю."}));
  rec = store.get(DRAFT);
  if (rec?.status==="submitted") return renderDone();
  if (rec) return startExam();
  renderLogin();
}

function renderLogin(){
  const f = el("form",{class:"card"});
  f.append(
    el("div",{}, el("div",{class:"eyebrow",text:"Вход участника"}), el("h2",{text:"Представьтесь перед началом"})),
    el("p",{class:"muted",text:`${SECTIONS.length} заданий: времена, артикли, открытый cloze, выбор слова, словообразование, чтение и аудирование по видео. Максимум ${TOTAL} баллов. Время ${CFG.TIME_LIMIT_MIN||70} минут, таймер запускается после нажатия «Начать». Работу можно отправить только один раз.`}),
    el("div",{class:"grid2"},
      el("label",{class:"f"},"Фамилия*", el("input",{type:"text",id:"surname",required:true,autocomplete:"family-name"})),
      el("label",{class:"f"},"Имя*", el("input",{type:"text",id:"fname",required:true,autocomplete:"given-name"})),
      el("label",{class:"f"},"Группа*", el("input",{type:"text",id:"group",required:true,placeholder:"например, ЭК-11"})),
      el("label",{class:"f"},"Код участника", el("input",{type:"text",id:"pcode",placeholder:"если выдан"}))),
    el("div",{class:"note",text:"Для аудирования понадобятся наушники. Не закрывайте вкладку без необходимости: черновик хранится в этом браузере."}),
    el("div",{class:"row"}, el("button",{type:"submit",text:"Начать олимпиаду"})));
  f.addEventListener("submit", e=>{ e.preventDefault(); const v=id=>$("#"+id).value.trim();
    const answers={open:""}; SECTIONS.forEach(s=>answers[s.id]=[]);
    rec={surname:v("surname"),name:v("fname"),group:v("group"),code:v("pcode"),status:"in_progress",startedAt:Date.now(),answers,leaves:0};
    store.set(DRAFT,rec); main.replaceChildren(); startExam(); });
  main.append(f);
}

function startExam(){
  $("#who").textContent=`${rec.surname} ${rec.name} · ${rec.group}`;
  main.replaceChildren(el("div",{class:"bar"}, el("nav",{class:"tabs",id:"tabs"}), el("span",{class:"timer",id:"timer"})), el("div",{id:"pane",style:"margin-top:14px"}));
  renderTabs(); renderSection();
  tick=setInterval(updateTimer,1000); updateTimer();
  document.addEventListener("visibilitychange",()=>{ if(document.hidden && rec.status!=="submitted"){ rec.leaves++; save(); } });
}
const save = () => store.set(DRAFT,rec);
function updateTimer(){ const left=rec.startedAt+(CFG.TIME_LIMIT_MIN||70)*60000-Date.now(); const t=$("#timer"); if(!t) return;
  t.textContent="⏱ "+fmtTime(left); t.classList.toggle("low",left<5*60000); if(left<=0){ clearInterval(tick); submit(true); } }
function go(id){ current=id; renderTabs(); renderSection(); scrollTo({top:0}); }
function renderTabs(){ const nav=$("#tabs"); nav.replaceChildren();
  SECTIONS.forEach(s=>nav.append(el("button",{type:"button","aria-current":String(current===s.id),onclick:()=>go(s.id)}, s.title, el("span",{class:"pts",text:maxOf(s)+" б."}))));
  nav.append(el("button",{type:"button","aria-current":String(current==="S"),onclick:()=>go("S")},"Отправка")); }
function setAns(sec,i,v){ rec.answers[sec] ||= []; rec.answers[sec][i]=v; save(); }
const cur = (sec,i) => (rec.answers[sec]||[])[i] ?? "";

function selectFor(sec,i,opts,label){
  const s=el("select",{class:"inl",id:`${sec}${i}`,"aria-label":label,onchange:e=>setAns(sec,i,e.target.value)}, el("option",{value:"",text:"—"}));
  opts.forEach(o=>s.append(el("option",{value:o,text:o==="-"?"– (no article)":o,selected:cur(sec,i)===o}))); return s; }

function gapText(sec){
  const box=el("div",{class:"text gaps"});
  sec.text.split("\n\n").forEach(par=>{
    const p=el("p",{}); let last=0; const re=/\[\[(\d+)(?:\|([^\]]*))?\]\]/g; let m;
    while((m=re.exec(par))){ p.append(par.slice(last,m.index)); const i=Number(m[1])-1;
      p.append(el("sup",{class:"gn",text:m[1]}));
      if (sec.kind==="type"){ const inp=el("input",{type:"text",class:"gap",id:`${sec.id}${i}`,"aria-label":`Gap ${m[1]}`,autocomplete:"off",autocapitalize:"off",spellcheck:"false",value:cur(sec.id,i)});
        inp.addEventListener("input",()=>setAns(sec.id,i,inp.value.trim())); p.append(inp); }
      else p.append(selectFor(sec.id,i, Array.isArray(sec.opts[0])?sec.opts[i]:sec.opts, `Gap ${m[1]}`));
      if (m[2]) p.append(el("span",{class:"hint",text:` (${m[2]})`}));
      last=re.lastIndex; }
    p.append(par.slice(last)); par.split("\n").length>1 ? (p.style.whiteSpace="pre-line") : 0; box.append(p); });
  return box;
}

function renderSection(){
  const pane=$("#pane"); pane.replaceChildren();
  if (current==="S") return renderSubmit(pane);
  const sec=SECTIONS.find(s=>s.id===current);
  const card=el("section",{class:"card"}, el("div",{}, el("div",{class:"eyebrow",text:maxOf(sec)+" баллов"}), el("h2",{text:sec.title})), el("p",{text:sec.intro}));
  if (sec.text) card.append(gapText(sec));
  if (sec.kind==="match"){
    sec.people.forEach(([L,name,txt])=>card.append(el("div",{class:"person"}, el("h3",{text:`${L}. ${name}`}), el("p",{text:txt}))));
    sec.qs.forEach((q,i)=>card.append(el("div",{class:"q"}, el("div",{class:"row"}, el("span",{class:"n",text:String(i+1)}), el("span",{style:"flex:1;min-width:200px",text:q}), selectFor(sec.id,i,["A","B","C","D","E"],`Question ${i+1}`)))));
  }
  if (sec.kind==="mcq"){
    const id=ytId(CFG.VIDEO_URL);
    if (id) card.append(el("div",{class:"video"}, el("iframe",{src:`https://www.youtube-nocookie.com/embed/${id}?rel=0`,title:"Listening video",allow:"encrypted-media; picture-in-picture",allowfullscreen:true})),
      el("p",{class:"muted"},"Если видео не открывается, используйте ссылку: ", el("a",{href:CFG.VIDEO_URL,target:"_blank",rel:"noopener",text:CFG.VIDEO_URL})));
    else card.append(el("div",{class:"note err",text:"Видео ещё не добавлено. Сообщите преподавателю."}));
    sec.qs.forEach((q,i)=>{ const box=el("div",{class:"opts",role:"radiogroup"});
      q.o.forEach((o,k)=>{ const id=`${sec.id}${i}_${k}`; box.append(el("label",{for:id}, el("input",{type:"radio",name:`${sec.id}${i}`,id,value:o,checked:cur(sec.id,i)===o,onchange:()=>setAns(sec.id,i,o)}), el("span",{text:`${"abc"[k]}) ${o}`}))); });
      card.append(el("div",{class:"q"}, el("div",{class:"n",text:`${i+1}`}), el("div",{text:q.t}), box)); });
    if (sec.open?.t){ const ta=el("textarea",{id:"open",placeholder:"Your answer in English…"}); ta.value=rec.answers.open||""; const wc=el("span",{class:"muted"});
      const upd=()=>wc.textContent=`Слов: ${words(ta.value)}`; ta.addEventListener("input",()=>{ rec.answers.open=ta.value; save(); upd(); }); upd();
      card.append(el("div",{class:"q"}, el("div",{class:"n",text:`Open question · ${sec.open.max} б. (проверяет преподаватель)`}), el("div",{text:sec.open.t}), ta, wc)); }
  }
  const idx=SECTIONS.indexOf(sec);
  card.append(el("div",{class:"row"}, el("button",{type:"button",onclick:()=>go(SECTIONS[idx+1]?.id||"S"),text:SECTIONS[idx+1]?"Следующее задание →":"К отправке →"})));
  pane.append(card);
}

function renderSubmit(pane){
  const miss=[];
  SECTIONS.forEach(s=>{ let n=0; for(let i=0;i<s.n;i++) if(!cur(s.id,i)) n++; if(n) miss.push(`${s.title}: без ответа ${n}`); });
  pane.append(el("section",{class:"card"}, el("h2",{text:"Отправка работы"}),
    miss.length? el("div",{class:"note err"}, el("b",{text:"Проверьте: "}), miss.join("; ")) : el("div",{class:"note",text:"Все задания заполнены."}),
    el("p",{text:"После отправки изменить ответы нельзя. Когда время закончится, работа отправится автоматически."}),
    el("label",{class:"row",for:"confirm"}, el("input",{type:"checkbox",id:"confirm",onchange:e=>{$("#send").disabled=!e.target.checked;}}),"Я проверил(а) ответы и готов(а) отправить работу"),
    el("div",{class:"row"}, el("button",{type:"button",id:"send",disabled:true,onclick:()=>submit(false),text:"Отправить работу"}), el("span",{class:"muted",id:"msg"}))));
}

async function submit(auto){
  if (rec.status==="submitted"||rec._sending) return; rec._sending=true;
  clearInterval(tick); const msg=$("#msg"); msg&&(msg.textContent="Отправляем…");
  try{
    const r=await rpc("olymp_submit",{p:{surname:rec.surname,name:rec.name,grp:rec.group,code:rec.code,answers:rec.answers,started_at:new Date(rec.startedAt).toISOString(),leaves:rec.leaves,auto_submitted:!!auto}});
    if (r && r.ok===false && r.reason==="duplicate"){ msg&&(msg.textContent="Работа с такими фамилией, именем и группой уже отправлена. Обратитесь к преподавателю."); rec._sending=false; return; }
    rec.status="submitted"; rec.submittedAt=Date.now(); delete rec._sending; save(); renderDone();
  }catch(e){ rec._sending=false; msg&&(msg.textContent="Не удалось отправить ("+e.message+"). Проверьте интернет и нажмите ещё раз."); if(auto) setTimeout(()=>submit(true),5000); }
}

function renderDone(){
  $("#who").textContent=`${rec.surname} ${rec.name} · ${rec.group}`;
  main.replaceChildren(el("div",{class:"card"}, el("div",{class:"eyebrow",text:"Работа принята"}), el("h2",{text:"Спасибо, ваши ответы отправлены"}),
    el("p",{text:"Результаты объявит преподаватель. Эту страницу можно закрыть."}), el("p",{class:"muted",text:"Отправлено: "+new Date(rec.submittedAt).toLocaleString("ru-RU")})));
}

/* ============================ TEACHER ============================ */
let PIN="", rows=[], threshold=Number(store.get("olymp_thr"))||Math.round(TOTAL*0.7), poll=null;

function renderTeacherLogin(){
  $("#who").textContent="Преподаватель";
  const f=el("form",{class:"card"}, el("h2",{text:"Вход преподавателя"}),
    el("label",{class:"f"},"PIN преподавателя", el("input",{type:"password",id:"pin",required:true,autocomplete:"current-password"})),
    el("div",{class:"row"}, el("button",{type:"submit",text:"Открыть результаты"}), el("span",{class:"muted",id:"pmsg"})));
  f.addEventListener("submit",async e=>{ e.preventDefault(); PIN=$("#pin").value; $("#pmsg").textContent="Проверяем…";
    try{ rows=await rpc("olymp_get_results",{pin:PIN}); renderTeacher(); }catch(err){ $("#pmsg").textContent="Не удалось войти: "+err.message; } });
  if(!configured()) f.append(el("div",{class:"note err",text:"Заполните SUPABASE_URL и SUPABASE_ANON_KEY в config.js."}));
  main.append(f);
}
async function refresh(){ try{ rows=await rpc("olymp_get_results",{pin:PIN}); draw(); $("#upd").textContent="обновлено "+new Date().toLocaleTimeString("ru-RU"); }catch(e){ $("#upd").textContent="ошибка обновления: "+e.message; } }

function renderTeacher(){
  $("#app").classList.add("wide"); main.replaceChildren(
    el("div",{class:"stats",id:"stats"}),
    el("div",{class:"card"},
      el("div",{class:"row",style:"justify-content:space-between"}, el("h2",{text:"Результаты участников"}),
        el("div",{class:"row"},
          el("label",{class:"row",for:"thr"},"Проходной балл", el("input",{type:"number",id:"thr",min:0,max:TOTAL,value:threshold,style:"width:80px",oninput:e=>{threshold=Number(e.target.value)||0; store.set("olymp_thr",threshold); draw();}}), el("span",{class:"muted",text:"из "+TOTAL})),
          el("button",{type:"button",class:"ghost",onclick:refresh,text:"Обновить"}),
          el("button",{type:"button",class:"ghost",onclick:csv,text:"Скачать CSV"}))),
      el("p",{class:"muted"},`Баллы за закрытые задания считает сервер по ключу. Открытый вопрос по видео оцените вручную (0–${OPEN_MAX}). `, el("span",{id:"upd"})),
      el("div",{class:"scroll"}, el("table",{id:"tbl"})),
      el("p",{class:"muted",id:"tmsg"})));
  draw(); poll=setInterval(refresh,20000);
}

function draw(){
  const data=rows.map(r=>({...r, total:(r.auto_score||0)+(r.open_score||0), needs: OPEN_MAX>0 && r.open_score==null}))
    .sort((a,b)=>b.total-a.total||(a.surname||"").localeCompare(b.surname||"","ru"));
  const avg=data.length?(data.reduce((s,r)=>s+r.total,0)/data.length).toFixed(1):"—";
  $("#stats").replaceChildren(...[[data.length,"работ отправлено"],[data.filter(r=>r.needs).length,"ждут проверки открытого ответа"],[avg,"средний балл"],[data.filter(r=>!r.needs&&r.total>=threshold).length,`прошли порог ${threshold}`]]
    .map(([b,s])=>el("div",{class:"stat"}, el("b",{text:String(b)}), el("span",{text:s}))));
  const head=["№","Участник","Группа",...SECTIONS.map(s=>`${s.title.split(". ")[0]} /${s.n*s.each}`),`Откр. /${OPEN_MAX}`,`Итого /${TOTAL}`,"Решение"];
  const t=$("#tbl"); t.replaceChildren(el("tr",{}, ...head.map((h,i)=>el("th",{class:i>=3&&i<head.length-1?"num":"",text:h}))));
  if(!data.length){ t.append(el("tr",{}, el("td",{colspan:head.length,class:"muted",text:"Пока ни одной отправленной работы."}))); return; }
  data.forEach((r,i)=>{
    const sc=r.scores||{};
    const os=el("input",{type:"number",min:0,max:OPEN_MAX,class:"oscore","aria-label":"Балл за открытый ответ",value:r.open_score??""});
    os.addEventListener("change",async()=>{ const v=os.value===""?null:Math.max(0,Math.min(OPEN_MAX,Math.round(Number(os.value))));
      try{ await rpc("olymp_set_open_score",{pin:PIN,rid:r.id,s:v}); r.open_score=v; draw(); }catch(e){ $("#tmsg").textContent="Не удалось сохранить: "+e.message; } });
    const flags=[]; if(r.code) flags.push(`код: ${r.code}`); if(r.leaves) flags.push(`уходил(а) со вкладки: ${r.leaves}`); if(r.auto_submitted) flags.push("отправлено по таймеру");
    if(r.started_at&&r.submitted_at) flags.push(`время работы: ${Math.round((new Date(r.submitted_at)-new Date(r.started_at))/60000)} мин`);
    const a=r.answers||{};
    const det=el("details",{}, el("summary",{text:"ответы"}), el("div",{class:"answers"},
      ...SECTIONS.map(s=>el("div",{text:`${s.title}: `+Array.from({length:s.n},(_,j)=>`${j+1}) ${(a[s.id]||[])[j]||"—"}`).join("; ")})),
      el("div",{class:"muted",text:flags.join(" · ")||"замечаний нет"}),
      el("div",{class:"essay",text:a.open||"(открытый ответ пуст)"})));
    const dec = r.needs ? el("span",{class:"pill wait",text:"проверить"}) : el("span",{class:"pill "+(r.total>=threshold?"ok":"bad"),text:r.total>=threshold?"проходит":"не проходит"});
    t.append(el("tr",{}, el("td",{class:"num",text:String(i+1)}), el("td",{}, el("div",{text:`${r.surname} ${r.name}`}),det), el("td",{text:r.grp||""}),
      ...SECTIONS.map(s=>el("td",{class:"num",text:String(sc[s.id]??0)})), el("td",{class:"num"},os), el("td",{class:"num"},el("b",{text:String(r.total)})), el("td",{},dec)));
  });
}

function csv(){
  const esc=v=>`"${String(v??"").replace(/"/g,'""')}"`;
  const lines=[["Фамилия","Имя","Группа","Код",...SECTIONS.map(s=>s.title),"Открытый","Итого","Решение","Уходы со вкладки","Отправлено"].map(esc).join(";")];
  rows.map(r=>({...r,total:(r.auto_score||0)+(r.open_score||0)})).sort((a,b)=>b.total-a.total).forEach(r=>{ const s=r.scores||{};
    lines.push([r.surname,r.name,r.grp,r.code,...SECTIONS.map(x=>s[x.id]??0),r.open_score??"",r.total,r.total>=threshold?"проходит":"не проходит",r.leaves||0,r.submitted_at?new Date(r.submitted_at).toLocaleString("ru-RU"):""].map(esc).join(";")); });
  const a=el("a",{href:URL.createObjectURL(new Blob(["﻿"+lines.join("\n")],{type:"text/csv"})),download:"olympiad_results.csv"}); document.body.append(a); a.click(); a.remove();
}

if ("serviceWorker" in navigator && location.protocol.startsWith("http")) navigator.serviceWorker.register("sw.js").catch(()=>{});
if (location.hash === "#teacher") renderTeacherLogin(); else bootStudent();
addEventListener("hashchange", ()=>location.reload());
</script>
