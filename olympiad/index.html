<style>
/* Sapphire design (approved Case Challenge template): navy masthead, gold hairlines, grid paper; premium depth + 3D globe in the masthead. */
:root{
  --bg:#e9eef4; --grid:rgba(11,37,69,.055); --surface:#ffffff; --surface-2:#f4f7fb;
  --ink:#0d1c31; --muted:#4f6079; --line:#d5dde8; --line-strong:#b9c6d6;
  --navy:#0b2545; --navy-2:#13345f; --navy-ink:#f3f6fb; --navy-muted:#a9bad1; --accent:#0f2f57; --accent-ink:#ffffff;
  --gold:#c9a24a; --gold-ink:#7a5c17; --gold-soft:rgba(201,162,74,.14); --gold-line:rgba(201,162,74,.55);
  --ok:#2c7a57; --ok-soft:rgba(44,122,87,.12); --bad:#a8461c; --warn:#a8671c; --warn-soft:rgba(168,103,28,.12);
  --soft:#f4f7fb;
  --shadow:0 1px 0 rgba(11,37,69,.05),0 10px 24px -14px rgba(11,37,69,.35);
  --shadow-lift:0 2px 0 rgba(11,37,69,.04),0 24px 48px -22px rgba(11,37,69,.45);
  --f-display:"Spectral",Georgia,"Times New Roman",serif;
  --f-body:"IBM Plex Sans",system-ui,-apple-system,"Segoe UI",sans-serif;
  --f-mono:"IBM Plex Mono",ui-monospace,Menlo,monospace;
  color-scheme:light;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#050b16; --grid:rgba(226,192,109,.055); --surface:#0b1527; --surface-2:#0f1c33;
  --ink:#e7ecf3; --muted:#97a7bd; --line:#1c2b44; --line-strong:#2b3d5b;
  --navy:#081a33; --navy-2:#0f2747; --navy-ink:#f1f4f9; --navy-muted:#93a6c2; --accent:#9cbde6; --accent-ink:#06101f;
  --gold:#e2c06d; --gold-ink:#e2c06d; --gold-soft:rgba(226,192,109,.12); --gold-line:rgba(226,192,109,.5);
  --ok:#6fcf9f; --ok-soft:rgba(111,207,159,.12); --bad:#ef8a6d; --warn:#e8b067; --warn-soft:rgba(232,176,103,.12); --soft:#0f1c33;
  --shadow:0 1px 0 rgba(0,0,0,.4),0 14px 30px -16px rgba(0,0,0,.8); --shadow-lift:0 2px 0 rgba(0,0,0,.4),0 30px 60px -24px rgba(0,0,0,.9);
  color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#050b16; --grid:rgba(226,192,109,.055); --surface:#0b1527; --surface-2:#0f1c33;
  --ink:#e7ecf3; --muted:#97a7bd; --line:#1c2b44; --line-strong:#2b3d5b;
  --navy:#081a33; --navy-2:#0f2747; --navy-ink:#f1f4f9; --navy-muted:#93a6c2; --accent:#9cbde6; --accent-ink:#06101f;
  --gold:#e2c06d; --gold-ink:#e2c06d; --gold-soft:rgba(226,192,109,.12); --gold-line:rgba(226,192,109,.5);
  --ok:#6fcf9f; --ok-soft:rgba(111,207,159,.12); --bad:#ef8a6d; --warn:#e8b067; --warn-soft:rgba(232,176,103,.12); --soft:#0f1c33;
  --shadow:0 1px 0 rgba(0,0,0,.4),0 14px 30px -16px rgba(0,0,0,.8); --shadow-lift:0 2px 0 rgba(0,0,0,.4),0 30px 60px -24px rgba(0,0,0,.9);
  color-scheme:dark}
*{box-sizing:border-box}
html,body{margin:0}
body{background-color:var(--bg);background-image:linear-gradient(var(--grid) 1px,transparent 1px),linear-gradient(90deg,var(--grid) 1px,transparent 1px);background-size:28px 28px;
  color:var(--ink);font:15px/1.55 var(--f-body);-webkit-font-smoothing:antialiased;padding-bottom:60px}
.gut{padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.wrap{max-width:860px;margin:0 auto;display:grid;gap:18px}
.wide{max-width:1200px}
/* Masthead with 3D scene */
.mast{position:relative;overflow:hidden;background:radial-gradient(120% 140% at 50% 0%,var(--navy-2) 0%,var(--navy) 60%);color:var(--navy-ink);border-bottom:3px double var(--gold);padding-block:34px 30px;isolation:isolate}
.mast canvas{position:absolute;inset:0;width:100%;height:100%;z-index:-1;opacity:.9}
.mast::after{content:"";position:absolute;inset:0;z-index:-1;background:linear-gradient(90deg,var(--navy) 0%,transparent 28%,transparent 72%,var(--navy) 100%);opacity:.55;pointer-events:none}
.mast .wrap{text-align:center;justify-items:center;gap:6px}
.mast .eyebrow{font-size:12px;letter-spacing:.18em;text-transform:uppercase;color:var(--gold)}
.mast h1{font-family:var(--f-display);font-weight:700;font-size:clamp(30px,5.4vw,52px);line-height:1.06;margin:.15em 0 .1em;text-wrap:balance;letter-spacing:.005em;text-shadow:0 2px 24px rgba(0,0,0,.35)}
.mast h1 em{font-style:italic;font-weight:500;color:var(--gold)}
.mast .sub{margin:0 auto;max-width:60ch;color:var(--navy-muted);font-size:15px}
.mast .tools{display:flex;gap:8px;flex-wrap:wrap;justify-content:center;margin-top:10px}
.chip{display:inline-flex;align-items:center;gap:7px;border:1px solid rgba(255,255,255,.18);background:rgba(255,255,255,.06);backdrop-filter:blur(6px);color:var(--navy-ink);border-radius:999px;padding:6px 12px;font:500 13px var(--f-body)}
button.chip{cursor:pointer} button.chip:hover{border-color:var(--gold)}
main{margin-top:22px}
h2{font:600 24px/1.2 var(--f-display);margin:0 0 4px;text-wrap:balance;letter-spacing:.005em}
h3{font:600 15px/1.3 var(--f-body);margin:6px 0 0}
.eyebrow{font:600 11px/1 var(--f-body);letter-spacing:.16em;text-transform:uppercase;color:var(--gold-ink)}
.muted{color:var(--muted)}
.card{position:relative;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:24px;display:grid;gap:14px;min-width:0;box-shadow:var(--shadow);
  background-image:linear-gradient(180deg,var(--gold-soft),transparent 64px);transition:transform .35s cubic-bezier(.2,.7,.2,1),box-shadow .35s}
.card::before{content:"";position:absolute;left:24px;right:24px;top:0;height:2px;background:linear-gradient(90deg,transparent,var(--gold),transparent);border-radius:2px}
.tilt{transform-style:preserve-3d;will-change:transform}
.tilt:hover{box-shadow:var(--shadow-lift)}
.grid2{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:12px}
label.f{display:grid;gap:5px;font-weight:500;font-size:13.5px;color:var(--muted)}
input[type=text],input[type=number],input[type=password],select,textarea{font:inherit;color:var(--ink);background:var(--surface-2);border:1px solid var(--line-strong);border-radius:8px;padding:10px 12px;width:100%;transition:border-color .2s,box-shadow .2s}
input:focus,select:focus,textarea:focus{outline:none;border-color:var(--gold);box-shadow:0 0 0 3px var(--gold-soft)}
select.inl{width:auto;display:inline-block;padding:4px 8px;margin:0 4px;border-radius:6px}
textarea{min-height:150px;resize:vertical}
button:focus-visible{outline:2px solid var(--gold);outline-offset:2px}
button{font:600 14px var(--f-body);border-radius:8px;padding:11px 18px;border:1px solid var(--navy);background:linear-gradient(180deg,var(--navy-2),var(--navy));color:var(--navy-ink);cursor:pointer;box-shadow:0 1px 0 rgba(255,255,255,.08) inset,0 8px 18px -10px rgba(11,37,69,.6);transition:transform .15s,box-shadow .2s,border-color .2s}
button:hover:not(:disabled){transform:translateY(-1px);border-color:var(--gold)}
button:active:not(:disabled){transform:translateY(0)}
:root[data-theme="dark"] button:not(.ghost):not(.chip):not(.tabs button){background:linear-gradient(180deg,#ecd08a,var(--gold));color:#0b2545;border-color:var(--gold)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) button:not(.ghost):not(.chip):not(.tabs button){background:linear-gradient(180deg,#ecd08a,var(--gold));color:#0b2545;border-color:var(--gold)}}
button.ghost{background:var(--surface);color:var(--ink);border-color:var(--line-strong);box-shadow:none}
button:disabled{opacity:.45;cursor:not-allowed}
.row{display:flex;flex-wrap:wrap;gap:10px;align-items:center}
.tabs{display:flex;gap:4px;overflow-x:auto;scrollbar-width:none;min-width:0;flex:1}
.tabs::-webkit-scrollbar{display:none}
.tabs button{flex:none;background:none;box-shadow:none;color:var(--muted);border:1px solid transparent;border-radius:999px;padding:7px 13px;font-weight:500;font-size:13.5px}
.tabs button:hover{color:var(--ink);background:var(--surface-2);transform:none}
.tabs button[aria-current="true"]{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.tabs .pts{font:500 11px var(--f-mono);opacity:.75;margin-left:6px}
.q{display:grid;gap:8px;padding:14px 0;border-top:1px dashed var(--line)}
.q .n{font:500 12px var(--f-mono);color:var(--gold-ink);letter-spacing:.04em}
.opts{display:grid;gap:6px}
.opts label{display:flex;gap:10px;align-items:flex-start;cursor:pointer;padding:8px 10px;border:1px solid var(--line);border-radius:8px;background:var(--surface-2);transition:border-color .2s,background .2s}
.opts label:hover{border-color:var(--gold-line)}
.opts label:has(input:checked){border-color:var(--gold);background:var(--gold-soft)}
.opts input{accent-color:var(--navy);margin-top:4px}
.text{background:var(--surface-2);border:1px solid var(--line);border-left:3px solid var(--gold);border-radius:8px;padding:16px 18px;max-width:72ch;font-family:var(--f-display);font-size:17px;line-height:1.7}
.bar{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:color-mix(in srgb,var(--bg) 82%,transparent);backdrop-filter:blur(10px);padding-block:8px;display:flex;flex-wrap:nowrap;gap:10px;align-items:center;justify-content:space-between;border-bottom:1px solid var(--line)}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--bg)}
.timer{font:500 15px var(--f-mono);font-variant-numeric:tabular-nums;border:1px solid var(--line-strong);background:var(--surface);border-radius:999px;padding:6px 12px;white-space:nowrap}
.timer.low{color:var(--bad);border-color:var(--bad)}
.note{border-left:3px solid var(--gold);padding:10px 14px;background:var(--gold-soft);border-radius:0 8px 8px 0;font-size:14px}
.err{border-left-color:var(--bad);background:var(--warn-soft)}
.video{position:relative;width:100%;max-width:100%;aspect-ratio:16/9;background:#000;border-radius:10px;overflow:hidden;box-shadow:var(--shadow-lift);border:1px solid var(--gold-line)}
.video iframe{position:absolute;inset:0;width:100%;height:100%;border:0}
table{border-collapse:collapse;width:100%;font-size:14px}
th,td{padding:9px 10px;border-bottom:1px solid var(--line);text-align:left;vertical-align:top}
th{font:600 11px var(--f-body);letter-spacing:.1em;text-transform:uppercase;color:var(--muted);white-space:nowrap;border-bottom:2px solid var(--gold-line)}
tr:hover td{background:var(--surface-2)}
td.num,th.num{text-align:right;font-family:var(--f-mono);font-variant-numeric:tabular-nums}
.scroll{overflow-x:auto}
.pill{display:inline-block;font:600 11px var(--f-body);letter-spacing:.05em;padding:3px 9px;border-radius:999px;border:1px solid currentColor;white-space:nowrap}
.pill.ok{color:var(--ok);background:var(--ok-soft)} .pill.bad{color:var(--bad)} .pill.wait{color:var(--warn);background:var(--warn-soft)}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:12px}
.stat{border:1px solid var(--line);border-radius:12px;padding:14px 16px;background:var(--surface);box-shadow:var(--shadow)}
.stat b{display:block;font:700 30px var(--f-display);font-variant-numeric:tabular-nums;color:var(--ink)}
.stat span{font-size:12px;color:var(--muted)}
details summary{cursor:pointer;color:var(--accent);font-weight:500}
.answers{font-size:13px;display:grid;gap:4px;margin-top:8px}
.essay{white-space:pre-wrap;background:var(--surface-2);padding:10px;border-radius:8px;max-width:68ch;font-size:14px}
.oscore{width:72px}
.gaps p{margin:0 0 12px;line-height:2.2}
input.gap{width:9.5em;display:inline-block;padding:3px 8px;margin:0 2px;font-family:var(--f-body);font-size:15px;border-radius:6px}
.gaps select.inl{font-family:var(--f-body);font-size:14px}
.gn{font:500 10px var(--f-mono);color:var(--gold-ink);margin-left:2px}
.hint{color:var(--muted);font-style:italic}
.person{display:grid;gap:4px;padding:14px 16px;border:1px solid var(--line);border-radius:10px;background:var(--surface-2)}
.person h3{font-family:var(--f-display);font-size:18px;margin:0}
.person p{margin:0;max-width:72ch}
@media (max-width:520px){.card{padding:18px}.text{font-size:16px}}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style>
</head>
<body>
<header class="mast gut">
  <canvas id="scene" aria-hidden="true"></canvas>
  <div class="wrap">
    <div class="eyebrow">English Language Week · Economics</div>
    <h1>Business English <em>Olympiad</em></h1>
    <p class="sub">Grammar, lexis, reading and listening for future economists.</p>
    <div class="tools">
      <span class="chip" id="who"></span>
      <button type="button" class="chip" id="themeBtn" aria-label="Switch light or dark theme"><span id="themeLbl">Dark</span></button>
    </div>
  </div>
</header>
<div id="app" class="wrap gut">
  <main id="main"></main>
</div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script src="config.js"></script>
<script>
/* ============================ CONTENT ============================
   Ключи ответов хранятся только в Supabase (таблица olymp_settings), здесь их нет.
   В текстах [[n|подсказка]] обозначает пропуск n (нумерация с 1). */
const CFG = window.OLYMPIAD_CONFIG || {};
const ART = ["a","an","the","-"];
const SECTIONS = [
 { id:"T", title:"1. Tenses", each:1, n:12, kind:"type",
   intro:"Put the verbs in brackets into the correct form.",
   text:"Dear Anna,\n\nThank you for your email. I [[1|receive]] it yesterday, but I [[2|be]] at a trade fair all day, so I couldn't reply. At the moment our team [[3|prepare]] the annual report, and it [[4|finish]] by Friday. Since January our sales [[5|grow]] by 12 per cent.\n\nLast month we [[6|sign]] a contract with a new supplier from Poland. Their goods are cheaper because they [[7|produce]] in a small town where costs are low. When I [[8|visit]] their factory, the workers [[9|load]] a lorry with our order.\n\nIf you [[10|have]] any questions, please call me. I [[11|send]] you the new figures as soon as I get them. I look forward to [[12|hear]] from you.\n\nBest regards,\nPeter" },
 { id:"R", title:"2. Articles", each:1, n:10, kind:"select", opts:ART,
   intro:"Fill the gaps with a / an / the or – (no article).",
   text:"[[1]] small company from Kazan has opened [[2]] online shop. [[3]] shop sells [[4]] tea and coffee at low prices. [[5]] owner, Marat Ilyin, is [[6]] economist by education. He says that [[7]] internet helped him find customers all over [[8]] Russia. Last year [[9]] number of orders doubled, and now he wants to open [[10]] office in Moscow." },
 { id:"C", title:"3. Lexis", each:1, n:10, kind:"type",
   intro:"Read the text and fill each gap with ONE word.",
   text:"Today more and more people pay [[1]] their purchases with a smartphone. This is convenient because you do not need to carry cash [[2]] you. Many small shops have also started [[3]] accept card payments. However, not everyone is happy [[4]] this change. Older people, [[5]] example, often prefer to use cash. Some experts say that cash is safer [[6]] digital money because it cannot be hacked. [[7]] the other hand, digital payments are faster and cheaper for businesses, [[8]] is why banks support them. In the future, cash may disappear completely, [[9]] it is difficult to say when. Whatever happens, we will all have [[10]] learn new ways of managing our money." },
 { id:"M", title:"4. Word choice", each:1, n:10, kind:"select",
   intro:"Complete the passage by choosing the word which best fits each gap.",
   opts:[["dreamed","thought","wondered","hoped"],["set","took","made","put"],["make","do","get","keep"],["high","tall","long","deep"],["take","make","borrow","lend"],["spent","paid","invested","bought"],["willing","wanting","agreeing","liking"],["employed","occupied","worked","used"],["pays","costs","earns","gives"],["on","over","at","in"]],
   text:"Anna had always [[1]] of running her own business. After college she [[2]] up a small bakery in her home town. At first it was hard to [[3]] ends meet because the rent was very [[4]]. She decided to [[5]] out a bank loan and [[6]] the money in a new oven. Soon her bread became popular, and customers were [[7]] to pay more for quality. Two years later she opened a second shop and [[8]] five new people. Her story shows that hard work really [[9]] off. Today Anna is [[10]] the moon about her results." },
 { id:"W", title:"5. Word formation", each:1, n:10, kind:"type",
   intro:"Use the word in brackets to form a word that fits the gap.",
   text:"Igor Petrov is one of the most [[1|SUCCESS]] young businessmen in our city. Five years ago the [[2|MANAGE]] of a large factory refused his plan, saying it was completely [[3|REAL]]. Igor made a quick [[4|DECIDE]] and started his own firm. Its sales rose [[5|DRAMATIC]] in the first year. The [[6|GROW]] of online trade helped him a lot. Igor knows that many young people face [[7|EMPLOY]] after college, so he hires graduates. He also works with a financial [[8|ADVISE]], because customers expect [[9|RELY]] service and stable prices. Now he spends money on the [[10|DEVELOP]] of new products." },
 { id:"P", title:"6. Reading: careers", each:1, n:10, kind:"match",
   intro:"Read about five people and their careers in economics. For questions 1–10, choose from the people A–E. The people may be chosen more than once.",
   people:[
    ["A","Olga, accountant","I chose accounting because my father, who is an accountant himself, told me it was a stable job. At first I was terrible at using the accounting software and made lots of mistakes, but my colleagues were patient with me. Now I work long hours during the tax season, so in spring I rarely see my friends."],
    ["B","Daniel, logistics specialist","After college I moved to Germany to work for a large logistics company. I noticed that our drivers wasted hours waiting at warehouses, so I suggested a new booking system for deliveries. My manager accepted the idea, and now the drivers finish work much earlier."],
    ["C","Irina, bank employee","I never planned to work in a bank. I wanted to be a journalist, but journalists' pay is often unpredictable, so I took a job as a bank clerk to have a regular salary. I enjoy talking to clients, and last year I became a customer service manager."],
    ["D","Pavel, online seller","I learnt everything about online sales from videos and books, and I have never taken a business course. I started by selling phone cases from my flat. Thanks to good reviews from my first customers, more and more people trust my shop, and now I'm hiring two assistants."],
    ["E","Maria, junior auditor","Many of my friends went to university, but I believe practical experience is more valuable than lectures. That's why I joined an audit firm as an intern straight after college. I asked my boss to let me check a real client's documents, and he was so impressed with my work that he offered me a permanent contract."]],
   qs:["Which person changed their career plans because they wanted a steady income?","Which person admits they were not good at one part of their job at first?","Which person benefited from showing what they could do?","Which person made a suggestion that improved colleagues' working conditions?","Which person thinks work experience is better than higher education?","Which person went abroad to work?","Which person followed a parent's advice?","Which person is self-taught in their field?","Which person used their good reputation to grow their business?","Which person has a limited social life at a certain time of year?"] },
 { id:"A", title:"7. Listening", each:2, kind:"mcq",
   intro:"Watch the video (you may watch it twice) and answer the questions. The answers are not said word for word in the video, so think about what you hear.",
   qs:[
    {t:"Why does the narrator mention that there are no rivers near Stonehenge?", o:["To explain why it was easy to bring the stones.","To show that the choice of the place is a puzzle.","To prove that the builders came from Wales."]},
    {t:"Ian says that about 6,000 people come on an average summer day and over a million people visit in a year. What can we conclude?", o:["The site gets the same number of visitors every day.","There are far fewer visitors per day outside the summer.","Most visitors come in winter."]},
    {t:"Compare the ditch and bank with the stone monument. The ditch and bank are…", o:["about 500 years younger.","the same age.","about 500 years older."]},
    {t:"How do researchers know where the builders lived?", o:["They found remains of huts at Durrington Walls.","They read written records of that time.","They studied the stone tools inside the monument."]},
    {t:"Compare the journeys of the two types of stone. Which statement is correct?", o:["The bluestones came a shorter distance than the sarsen stones.","Both types of stone came from Wales.","The bluestones travelled about ten times farther than the sarsen stones."]},
    {t:"About a hundred men were probably needed to pull one sarsen stone. What does this suggest about the people who built Stonehenge?", o:["The work was done by a few specialists.","They could organise a large number of workers.","They used machines to move the stones."]},
    {t:"Which of these does Ian present as known for sure, not as a theory?", o:["The monument is aligned with the summer and winter solstices.","It was built by people from another planet.","It was a monument to the ancestors."]},
    {t:"What is the main idea of the end of the video?", o:["New technology shows the site is more complex than people thought.","Scientists now know everything about Stonehenge.","The stones under the ground were added recently."]}
   ],
   open:{t:"Stonehenge receives more than a million visitors a year. Imagine you are an economist. Name two ways the monument benefits the local economy and one problem that mass tourism can cause. Write 40–60 words.", max:4} }
];
SECTIONS.forEach(s=>{ if(!s.n) s.n=s.qs.length; });

/* ============================ HELPERS ============================ */
const $ = s => document.querySelector(s);
const el = (tag, attrs={}, ...kids) => { const e=document.createElement(tag);
  for (const [k,v] of Object.entries(attrs)) { if (k==="class") e.className=v; else if (k==="text") e.textContent=v; else if (k.startsWith("on")) e.addEventListener(k.slice(2),v); else if (v!==false && v!=null) e.setAttribute(k,v===true?"":v); }
  for (const k of kids) if (k!=null) e.append(k); return e; };
const words = s => (s||"").trim().split(/\s+/).filter(Boolean).length;
const fmtTime = ms => { const s=Math.max(0,Math.floor(ms/1000)); return String(Math.floor(s/60)).padStart(2,"0")+":"+String(s%60).padStart(2,"0"); };

  if (!r.ok) throw new Error(data?.message || ("HTTP "+r.status)); return data; }

function gapText(sec){
  const box=el("div",{class:"text gaps"});
  sec.text.split("\n\n").forEach(par=>{
    const p=el("p",{}); let last=0; const re=/\[\[(\d+)(?:\|([^\]]*))?\]\]/g; let m;
    while((m=re.exec(par))){ p.append(par.slice(last,m.index)); const i=Number(m[1])-1;
      p.append(el("sup",{class:"gn",text:m[1]}));
      if (sec.kind==="type"){ const inp=el("input",{type:"text",class:"gap",id:`${sec.id}${i}`,"aria-label":`Gap ${m[1]}`,autocomplete:"off",autocapitalize:"off",spellcheck:"false",value:cur(sec.id,i)});
        inp.addEventListener("input",()=>setAns(sec.id,i,inp.value.trim())); p.append(inp); }
      else p.append(selectFor(sec.id,i, Array.isArray(sec.opts[0])?sec.opts[i]:sec.opts, `Gap ${m[1]}`));
      if (m[2]) p.append(el("span",{class:"hint",text:` (${m[2]})`}));
      last=re.lastIndex; }
    p.append(par.slice(last)); par.split("\n").length>1 ? (p.style.whiteSpace="pre-line") : 0; box.append(p); });
  return box;
}

  });

function csv(){

  const lines=[["Фамилия","Имя","Группа","Код",...SECTIONS.map(s=>s.title),"Открытый","Итого","Решение","Уходы со вкладки","Отправлено"].map(esc).join(";")];

(function scene3d(){

  // Orbits with gold coins
  const orbits=[];
  [[3.1,.35,0],[3.6,-.5,.8],[4.1,.15,2.1]].forEach(([R,tilt,phase],k)=>{
    const o=new THREE.Group(); o.rotation.x=Math.PI/2+tilt; o.rotation.y=tilt*.6;
    o.add(new THREE.Mesh(new THREE.TorusGeometry(R,.01,6,200), new THREE.MeshBasicMaterial({color:GOLD,transparent:true,opacity:.35})));
    const coin=new THREE.Mesh(new THREE.CylinderGeometry(.2,.2,.045,40), new THREE.MeshStandardMaterial({color:GOLD,metalness:.95,roughness:.25,emissive:0x3a2a05}));
    o.add(coin); orbits.push({o,coin,R,phase,speed:.25+k*.08}); g.add(o);
  });
  // Star dust
  const N=260, pos=new Float32Array(N*3); for(let i=0;i<N;i++){ pos[i*3]=(Math.random()-.5)*26; pos[i*3+1]=(Math.random()-.5)*10; pos[i*3+2]=(Math.random()-.5)*8-3; }
  const dust=new THREE.BufferGeometry(); dust.setAttribute("position",new THREE.BufferAttribute(pos,3));
  scene.add(new THREE.Points(dust,new THREE.PointsMaterial({color:GOLD,size:.035,transparent:true,opacity:.6})));
  let tx=0,ty=0;
  addEventListener("pointermove",e=>{ tx=(e.clientX/innerWidth-.5); ty=(e.clientY/innerHeight-.5); },{passive:true});
  function size(){ const w=c.clientWidth,h=c.clientHeight; if(!w||!h) return; renderer.setSize(w,h,false); cam.aspect=w/h; cam.updateProjectionMatrix();
    const halfW=Math.tan(cam.fov*Math.PI/360)*cam.position.z*cam.aspect, side=halfW>9;
    // Wide screens: globe sits to the right of the title. Narrow screens: centred behind the text, dimmed.
    g.position.set(side?halfW-4.4:0, side?0:-.2, 0); g.scale.setScalar(side?1:.75); c.style.opacity = side?".9":".35"; }
  addEventListener("resize",size); size();
  const t0=performance.now();
  function frame(now){ const t=(now-t0)/1000;
    g.rotation.y = t*.12 + tx*.5; g.rotation.x += ((ty*.35)-g.rotation.x)*.05;
    orbits.forEach(({coin,R,phase,speed})=>{ const a=t*speed+phase; coin.position.set(Math.cos(a)*R,Math.sin(a)*R,0); coin.rotation.x=t*1.5; coin.rotation.z=a; });
    renderer.render(scene,cam); if(!reduceMotion) requestAnimationFrame(frame); }
  requestAnimationFrame(frame);
})();

if (!reduceMotion && matchMedia("(pointer:fine)").matches){
  document.addEventListener("pointermove",e=>{ const el=e.target.closest?.(".tilt"); document.querySelectorAll(".tilt").forEach(t=>{ if(t!==el) t.style.transform=""; });
    if(!el) return; const r=el.getBoundingClientRect(); const x=(e.clientX-r.left)/r.width-.5, y=(e.clientY-r.top)/r.height-.5;
    el.style.transform=`perspective(1200px) rotateX(${(-y*3).toFixed(2)}deg) rotateY(${(x*3).toFixed(2)}deg) translateY(-2px)`; },{passive:true});
}

if ("serviceWorker" in navigator && location.protocol.startsWith("http")) navigator.serviceWorker.register("sw.js").catch(()=>{});
if (location.hash.startsWith("#teacher")) renderTeacherLogin(); else bootStudent();
const startedAsTeacher = location.hash.startsWith("#teacher");
addEventListener("hashchange", ()=>{ if (location.hash.startsWith("#teacher=") || location.hash.startsWith("#teacher")!==startedAsTeacher) location.reload(); });
</script>
