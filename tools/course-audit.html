<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Методический аудит курса</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Unbounded:wght@400;500;700&family=Golos+Text:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap">
<style>
/* Layout: рабочий стол эксперта. Левая колонка-оглавление аудита, справа рабочая панель; обзор открывается 3D-профилем восьми блоков. */
:root{
  --bg:#ECEEF1; --surface:#FFFFFF; --surface-2:#F4F5F7; --sunken:#E3E6EA;
  --ink:#121519; --muted:#59606D; --faint:#8C93A0; --line:#D5D9E0; --line-strong:#B9BFC9;
  --accent:#0E6B5C; --accent-ink:#FFFFFF; --accent-soft:#D9EDE8;
  --mark:#E2A623; --mark-soft:#FBEFCF;
  --ok:#24805A; --warn:#B9761A; --crit:#B3342B; --nd:#7D8494;
  --s0:#A8302A; --s1:#C24F2E; --s2:#CB7A22; --s3:#B99A22; --s4:#4C9A69; --s5:#1E7F63;
  --shadow:0 1px 2px rgba(18,21,25,.06),0 8px 24px -12px rgba(18,21,25,.18);
  --dots:rgba(18,21,25,.075); --glass:rgba(255,255,255,.72);
  --f-display:"Unbounded","Golos Text",system-ui,sans-serif;
  --f-body:"Golos Text",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  --f-mono:"JetBrains Mono",ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
  --r:10px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0C0F12; --surface:#141920; --surface-2:#1A2028; --sunken:#0F1318;
  --ink:#E6E9ED; --muted:#9AA2AF; --faint:#6B7380; --line:#27303A; --line-strong:#3A4552;
  --accent:#3DBFA6; --accent-ink:#06231D; --accent-soft:#12332D;
  --mark:#F0BA45; --mark-soft:#3A2F14;
  --ok:#4CC08A; --warn:#E3A043; --crit:#F06A5C; --nd:#8A92A1;
  --s0:#E2594D; --s1:#E5774F; --s2:#E59A45; --s3:#D9BE4A; --s4:#5FBF86; --s5:#3DBFA6;
  --shadow:0 1px 2px rgba(0,0,0,.4),0 10px 30px -14px rgba(0,0,0,.7);
  --dots:rgba(255,255,255,.055); --glass:rgba(20,25,32,.72);
  color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0C0F12; --surface:#141920; --surface-2:#1A2028; --sunken:#0F1318;
  --ink:#E6E9ED; --muted:#9AA2AF; --faint:#6B7380; --line:#27303A; --line-strong:#3A4552;
  --accent:#3DBFA6; --accent-ink:#06231D; --accent-soft:#12332D;
  --mark:#F0BA45; --mark-soft:#3A2F14;
  --ok:#4CC08A; --warn:#E3A043; --crit:#F06A5C; --nd:#8A92A1;
  --s0:#E2594D; --s1:#E5774F; --s2:#E59A45; --s3:#D9BE4A; --s4:#5FBF86; --s5:#3DBFA6;
  --shadow:0 1px 2px rgba(0,0,0,.4),0 10px 30px -14px rgba(0,0,0,.7);
  --dots:rgba(255,255,255,.055); --glass:rgba(20,25,32,.72);
  color-scheme:dark}

*{box-sizing:border-box}
html,body{background:var(--bg);color:var(--ink)}
body{background-color:var(--bg);background-image:radial-gradient(1100px 520px at 78% -8%,color-mix(in srgb,var(--accent) 13%,transparent),transparent 70%),radial-gradient(700px 420px at -10% 30%,color-mix(in srgb,var(--mark) 9%,transparent),transparent 70%),radial-gradient(var(--dots) 1px,transparent 1.3px);background-size:auto,auto,22px 22px;font-family:var(--f-body);font-size:15px;line-height:1.55;-webkit-font-smoothing:antialiased}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:30;background:var(--surface)}
h1,h2,h3{font-family:var(--f-display);font-weight:500;letter-spacing:-.01em;text-wrap:balance;margin:0}
p{margin:0}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--mark);outline-offset:2px;border-radius:6px}
.mono{font-family:var(--f-mono);font-variant-numeric:tabular-nums}
.eyebrow{font-family:var(--f-mono);font-size:11px;letter-spacing:.12em;text-transform:uppercase;color:var(--muted)}

/* top bar */
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--glass);-webkit-backdrop-filter:saturate(1.5) blur(14px);backdrop-filter:saturate(1.5) blur(14px);border-bottom:1px solid var(--line)}
.top-in{display:flex;align-items:center;gap:16px;min-height:58px;padding-block:8px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.brand{display:flex;align-items:center;gap:10px;min-width:0}
.brand-mark{width:30px;height:30px;flex:none}
.brand b{font-family:var(--f-display);font-weight:500;font-size:14px;white-space:nowrap}
.brand span{display:block;font-size:11px;color:var(--muted);font-family:var(--f-mono);letter-spacing:.06em}
.top-prog{flex:1;display:flex;align-items:center;gap:10px;min-width:0;justify-content:flex-end}
.meter{width:min(220px,30vw);height:6px;border-radius:9px;background:var(--sunken);overflow:hidden}
.meter i{display:block;height:100%;background:var(--accent);border-radius:9px;transition:width .4s}
a{color:var(--accent)}
.btn{color:var(--ink);text-decoration:none;display:inline-flex;align-items:center;gap:8px;border:1px solid var(--line-strong);background:var(--surface);border-radius:8px;padding:7px 12px;cursor:pointer;font-size:13.5px;font-weight:500;transition:background .15s,border-color .15s,transform .1s;white-space:nowrap}
.btn:hover{background:var(--surface-2);border-color:var(--ink)}
.btn:active{transform:translateY(1px)}
.btn.primary{background:linear-gradient(180deg,color-mix(in srgb,var(--accent) 86%,#fff),var(--accent));border-color:var(--accent);color:var(--accent-ink);box-shadow:inset 0 1px 0 rgba(255,255,255,.18),0 8px 18px -10px var(--accent)}
.btn.primary:hover{filter:brightness(1.08)}
.btn.ghost{border-color:transparent;background:transparent}
.btn.ghost:hover{background:var(--surface-2);border-color:var(--line)}
.btn.danger{color:var(--crit);border-color:color-mix(in srgb,var(--crit) 45%,transparent)}
.btn.sm{padding:4px 9px;font-size:12.5px}

/* shell */
.shell{display:grid;grid-template-columns:250px minmax(0,1fr);gap:28px;max-width:1440px;margin:0 auto;padding-block:24px 80px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
nav.rail{position:sticky;top:calc(env(safe-area-inset-top,0px) + 78px);align-self:start;display:flex;flex-direction:column;gap:18px;max-height:calc(100vh - 100px);overflow:auto;padding-right:4px}
.rail-group{display:flex;flex-direction:column;gap:2px}
.rail-group>.eyebrow{padding:0 10px 6px}
.rail a{display:flex;align-items:center;gap:10px;padding:7px 10px;border-radius:8px;text-decoration:none;color:var(--muted);font-size:14px;line-height:1.3}
.rail a:hover{background:var(--surface);color:var(--ink)}
.rail a.on{background:var(--surface);color:var(--ink);box-shadow:var(--shadow);font-weight:500}
.rail a .n{font-family:var(--f-mono);font-size:11px;width:20px;color:var(--faint)}
.rail a .t{flex:1;min-width:0}
.dot{width:8px;height:8px;border-radius:50%;background:var(--line-strong);flex:none}
.dot.part{background:var(--mark)}
.dot.done{background:var(--ok)}
.dot.warn{background:var(--crit)}
.rail .sc{font-family:var(--f-mono);font-size:11px;padding:1px 6px;border-radius:5px;background:var(--surface-2);color:var(--muted)}

main{min-width:0}
.panel{display:flex;flex-direction:column;gap:22px;animation:rise .35s ease both}
@keyframes rise{from{opacity:.0;transform:translateY(6px)}to{opacity:1;transform:none}}
@media (prefers-reduced-motion:reduce){.panel{animation:none}*{transition:none!important}}
.head{display:flex;flex-wrap:wrap;align-items:flex-end;justify-content:space-between;gap:14px}
.head h2{font-size:clamp(22px,2.4vw,30px);line-height:1.15}
.head p{color:var(--muted);max-width:70ch;margin-top:6px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:20px}
.card.flat{box-shadow:none}
.card h3{font-size:15px;font-weight:500;margin-bottom:12px}
.grid2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px}
.grid3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:14px}
.stack{display:flex;flex-direction:column;gap:12px}
.row{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.note{font-size:13px;color:var(--muted)}
.note.box{background:var(--surface-2);border:1px dashed var(--line-strong);border-radius:8px;padding:10px 12px}

label.f{display:flex;flex-direction:column;gap:5px;min-width:0}
label.f>span{font-size:12.5px;color:var(--muted);font-weight:500}
label.f>span em{font-style:normal;color:var(--crit)}
input[type=text],select,textarea{width:100%;background:var(--surface-2);border:1px solid var(--line);border-radius:8px;padding:9px 11px;font-size:14.5px;transition:border-color .15s,background .15s}
textarea{resize:vertical;min-height:72px;line-height:1.5}
input[type=text]:focus,select:focus,textarea:focus{outline:none;border-color:var(--accent);background:var(--surface)}
input::placeholder,textarea::placeholder{color:var(--faint)}
textarea.need{border-color:color-mix(in srgb,var(--crit) 60%,var(--line))}

/* example banner */
.banner{display:flex;flex-wrap:wrap;gap:12px;align-items:center;justify-content:space-between;background:var(--mark-soft);border:1px solid color-mix(in srgb,var(--mark) 55%,transparent);border-radius:var(--r);padding:12px 16px;font-size:14px}

/* hero */
.hero{position:relative;display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.15fr);gap:0;background:var(--surface);border:1px solid var(--line);border-radius:14px;overflow:hidden;box-shadow:var(--shadow)}
.hero-l{padding:28px;display:flex;flex-direction:column;gap:18px;border-right:1px solid var(--line);min-width:0}
.hero-l h1{font-size:clamp(24px,3vw,38px);line-height:1.1;font-weight:500}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{font-size:12px;padding:3px 9px;border-radius:99px;border:1px solid var(--line);background:var(--surface-2);color:var(--muted)}
.chip.empty{border-style:dashed;color:var(--faint)}
.index{display:flex;align-items:flex-end;gap:16px;flex-wrap:wrap}
.index .big{font-family:var(--f-display);font-size:clamp(46px,6vw,72px);line-height:.9;font-weight:500;letter-spacing:-.03em}
.ring{position:relative;width:148px;height:148px;flex:none}
.ring svg{width:100%;height:100%;display:block}
.ring .c{position:absolute;inset:0;display:grid;place-items:center;text-align:center}
.ring .c b{font-family:var(--f-display);font-size:36px;font-weight:500;line-height:1;letter-spacing:-.02em}
.ring .c span{display:block;font-family:var(--f-mono);font-size:10px;color:var(--faint);letter-spacing:.1em;margin-top:4px}
.ring path{transition:stroke .3s}
.index .big small{font-size:.38em;color:var(--faint);font-weight:400}
.index .cap{font-size:13px;color:var(--muted);max-width:28ch}
.pill{display:inline-flex;align-items:center;gap:7px;font-size:12.5px;font-weight:500;padding:5px 11px;border-radius:99px;border:1px solid currentColor}
.pill::before{content:"";width:7px;height:7px;border-radius:50%;background:currentColor}
.pill.ok{color:var(--ok)}.pill.warn{color:var(--warn)}.pill.crit{color:var(--crit)}.pill.nd{color:var(--nd)}
.hero-r{position:relative;min-height:440px;background:
  radial-gradient(70% 55% at 50% 78%,color-mix(in srgb,var(--accent) 24%,transparent),transparent 70%),
  radial-gradient(var(--dots) 1px,transparent 1.3px) 0 0/18px 18px,
  linear-gradient(180deg,var(--surface-2),var(--sunken))}
#stage{position:absolute;inset:0;cursor:grab;touch-action:pan-y;overflow:hidden}
#stage.drag{cursor:grabbing}
#stage canvas{display:block;width:100%!important;height:100%!important}
.lbl{position:absolute;left:0;top:0;pointer-events:none;font-family:var(--f-mono);font-size:10px;white-space:nowrap;text-align:center;color:var(--muted);padding:3px 8px 4px;border-radius:8px;background:var(--glass);border:1px solid var(--line);box-shadow:var(--shadow);line-height:1.15;transition:opacity .2s;will-change:transform}
.lbl b{display:block;font-family:var(--f-display);font-size:14px;font-weight:500;color:var(--ink)}
.lbl.far{opacity:.55}
.lbl.hl{border-color:var(--accent)}.lbl.hl b{color:var(--accent)}
.stage-cap{position:absolute;left:16px;right:16px;bottom:12px;display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap;font-size:11.5px;color:var(--muted);pointer-events:none}
.legend{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.legend i{display:inline-block;width:9px;height:9px;border-radius:2px;margin-right:4px;vertical-align:-1px}
.tip{position:absolute;top:14px;left:14px;max-width:260px;background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:8px 11px;font-size:12.5px;box-shadow:var(--shadow);pointer-events:none}
.fallback{position:absolute;inset:0;display:grid;place-items:center;padding:20px}

/* chain */
.chain{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:0;align-items:stretch}
.link{position:relative;padding:14px 16px;border:1px solid var(--line);background:var(--surface);min-width:0}
.link:first-child{border-radius:10px 0 0 10px}
.link:last-child{border-radius:0 10px 10px 0}
.link+.link{border-left:none}
.link:not(:last-child)::after{content:"";position:absolute;right:-8px;top:50%;width:14px;height:14px;background:var(--surface);border-top:1px solid var(--line);border-right:1px solid var(--line);transform:translateY(-50%) rotate(45deg);z-index:1}
.link .k{font-family:var(--f-mono);font-size:10.5px;letter-spacing:.1em;text-transform:uppercase;color:var(--muted)}
.link .v{font-family:var(--f-display);font-size:22px;margin-top:4px}
.link .v small{font-size:13px;color:var(--faint)}
.bar{height:4px;border-radius:9px;background:var(--sunken);margin-top:8px;overflow:hidden}
.bar i{display:block;height:100%;border-radius:9px}

/* tiles */
.tiles{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px;perspective:900px}
.tile{--tc:var(--line-strong);background:radial-gradient(180px 120px at 100% 0,color-mix(in srgb,var(--tc) 20%,transparent),transparent 72%),var(--surface)!important;position:relative;display:flex;flex-direction:column;gap:10px;padding:16px;border-radius:12px;background:var(--surface);border:1px solid var(--line);text-decoration:none;color:inherit;transform:rotateX(var(--rx,0)) rotateY(var(--ry,0));transition:transform .25s ease,box-shadow .25s,border-color .2s;transform-style:preserve-3d;min-width:0}
.tile:hover{box-shadow:var(--shadow);border-color:color-mix(in srgb,var(--tc) 60%,var(--line))}
.qbar{display:flex;gap:2px;height:5px;border-radius:9px;overflow:hidden;background:var(--sunken)}
.qbar i{display:block;height:100%}
.tile .top-row{display:flex;justify-content:space-between;align-items:flex-start;gap:8px}
.tile .num{font-family:var(--f-mono);font-size:11px;color:var(--faint)}
.tile h4{margin:0;font-size:14px;font-weight:500;line-height:1.3}
.tile .meta{font-size:12px;color:var(--muted);display:flex;justify-content:space-between;gap:6px}
.score{display:inline-grid;place-items:center;min-width:38px;height:30px;padding:0 8px;border-radius:7px;font-family:var(--f-display);font-size:15px;font-weight:500;background:var(--surface-2);color:var(--faint);border:1px dashed var(--line-strong)}
.score.v0{background:var(--s0);color:#fff;border:none}.score.v1{background:var(--s1);color:#fff;border:none}.score.v2{background:var(--s2);color:#fff;border:none}
.score.v3{background:var(--s3);color:#1b1600;border:none}.score.v4{background:var(--s4);color:#fff;border:none}.score.v5{background:var(--s5);color:#fff;border:none}
.score.nd{background:transparent;color:var(--nd);border:1px solid var(--nd);font-family:var(--f-mono);font-size:12px}

/* checks */
.checks{display:flex;flex-direction:column;gap:6px}
.check{display:flex;gap:10px;align-items:flex-start;padding:9px 12px;border-radius:8px;background:var(--surface-2);font-size:13.5px;text-decoration:none;color:inherit;border-left:3px solid var(--line-strong)}
.check.err{border-left-color:var(--crit)}
.check.wrn{border-left-color:var(--warn)}
.check.inf{border-left-color:var(--nd)}
.check .lvl{font-family:var(--f-mono);font-size:10.5px;text-transform:uppercase;letter-spacing:.08em;flex:none;width:68px;padding-top:2px}
.check.err .lvl{color:var(--crit)}.check.wrn .lvl{color:var(--warn)}.check.inf .lvl{color:var(--nd)}
a.check:hover{background:var(--sunken)}

/* block questions */
.q{display:grid;grid-template-columns:28px minmax(0,1fr);gap:4px 12px;padding:14px 0;border-top:1px solid var(--line)}
.q:first-child{border-top:none;padding-top:0}
.q .i{font-family:var(--f-mono);font-size:12px;color:var(--faint);padding-top:2px}
.q .txt{font-size:14.5px}
.q .ctl{grid-column:2;display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-top:6px}
.q .ctl input{flex:1;min-width:200px;padding:6px 10px;font-size:13.5px}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:8px;overflow:hidden;background:var(--surface-2);flex-wrap:wrap}
.seg button{border:none;background:transparent;padding:5px 10px;font-size:12.5px;cursor:pointer;color:var(--muted);border-right:1px solid var(--line)}
.seg button:last-child{border-right:none}
.seg button:hover{color:var(--ink);background:var(--sunken)}
.seg button.on{color:var(--ink);background:var(--surface);font-weight:600;box-shadow:inset 0 -2px 0 var(--accent)}
.seg button.on[data-v="no"]{box-shadow:inset 0 -2px 0 var(--crit)}
.seg button.on[data-v="part"]{box-shadow:inset 0 -2px 0 var(--mark)}
.seg button.on[data-v="na"]{box-shadow:inset 0 -2px 0 var(--nd)}
.scale{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:8px}
.scale button{display:flex;flex-direction:column;align-items:flex-start;gap:6px;padding:12px;border-radius:10px;border:1px solid var(--line);background:var(--surface-2);cursor:pointer;text-align:left;min-width:0;transition:transform .15s,border-color .15s}
.scale button:hover{border-color:var(--line-strong);transform:translateY(-2px)}
.scale button b{font-family:var(--f-display);font-size:22px;font-weight:500;line-height:1}
.scale button span{font-size:11.5px;color:var(--muted);line-height:1.3}
.scale button.on{border-color:var(--ink);background:var(--surface);box-shadow:var(--shadow)}
.scale button.on b{color:var(--accent)}
.bhead{position:relative;overflow:hidden;display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:6px 22px;align-items:center;padding:22px 24px;border-radius:14px;border:1px solid var(--line);background:radial-gradient(420px 200px at 100% 0,color-mix(in srgb,var(--tc,var(--accent)) 20%,transparent),transparent 70%),var(--surface);box-shadow:var(--shadow)}
.bnum{font-family:var(--f-display);font-weight:700;font-size:clamp(52px,7vw,84px);line-height:.8;color:transparent;-webkit-text-stroke:1.5px var(--line-strong);letter-spacing:-.04em}
.bhead h2{font-size:clamp(19px,2.3vw,28px);line-height:1.15;overflow-wrap:anywhere;hyphens:auto}
.bhead .bmeta{display:flex;gap:10px;align-items:center;margin-top:10px;font-size:12.5px;color:var(--muted)}
.bhead .qbar{width:min(260px,40vw)}
.bhead .bscore{display:flex;flex-direction:column;align-items:center;gap:4px}
.bhead .bscore .score{height:52px;min-width:64px;font-size:26px;border-radius:12px}
.focus{border-left:3px solid var(--mark);padding:2px 0 2px 14px;color:var(--muted);font-size:14px;max-width:80ch}
.hours{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px}
.stackbar{display:flex;height:26px;border-radius:7px;overflow:hidden;background:var(--sunken);margin-top:6px}
.stackbar div{display:grid;place-items:center;font-size:11px;font-family:var(--f-mono);color:#fff;min-width:0;overflow:hidden;white-space:nowrap}

/* lists of records */
.rec{display:grid;gap:10px;padding:16px;border:1px solid var(--line);border-radius:10px;background:var(--surface);position:relative}
.rec .rec-h{display:flex;justify-content:space-between;align-items:center;gap:10px}
.rec .rec-h .eyebrow{color:var(--faint)}

.gaps{display:flex;flex-wrap:wrap;gap:6px}

.col h3{display:flex;justify-content:space-between;align-items:center}
.item{display:flex;gap:8px;align-items:flex-start}

.x:hover{color:var(--crit);background:var(--surface-2)}

/* outcomes analyzer */
.lo{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:6px 14px;padding:12px 14px;border-radius:9px;background:var(--surface-2);border-left:3px solid var(--line-strong)}
.lo.bad{border-left-color:var(--crit)}.lo.good{border-left-color:var(--ok)}.lo.mid{border-left-color:var(--mark)}
.lo .s{font-size:12.5px;color:var(--muted);grid-column:1/-1}
.lo mark{background:var(--mark-soft);color:var(--ink);padding:0 3px;border-radius:3px}
.verbs{display:flex;flex-wrap:wrap;gap:6px}

.verbs button:hover{border-color:var(--accent);color:var(--accent)}
.bloom{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:8px}
.bloom div{padding:10px;border-radius:8px;background:var(--surface-2);border:1px solid var(--line);min-width:0}
.bloom b{display:block;font-size:12.5px;margin-bottom:4px}
.bloom span{font-size:12px;color:var(--muted)}

.report p,.report li{font-size:14.5px;max-width:75ch}
.report p+p{margin-top:8px}
.report ul{margin:6px 0;padding-left:20px}
.tw{overflow-x:auto;margin:8px 0}
table{border-collapse:collapse;width:100%;font-size:13.5px}
th,td{border:1px solid var(--line);padding:7px 9px;text-align:left;vertical-align:top}
th{background:var(--surface-2);font-weight:600;font-size:12.5px}

pre.prompt{white-space:pre-wrap;word-break:break-word;font-family:var(--f-mono);font-size:12.5px;line-height:1.6;background:var(--surface-2);border:1px solid var(--line);border-radius:10px;padding:18px;max-height:640px;overflow:auto;margin:0}
.toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%) translateY(20px);background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:9px;font-size:13.5px;opacity:0;pointer-events:none;transition:.25s;z-index:50}

.radar svg{max-width:100%;height:auto;display:block}

.dstat{display:flex;flex-direction:column;gap:6px;width:100%;max-width:560px;text-align:left}

<script>
(function(){
"use strict";
/* ---------- справочные данные ---------- */
const BLOCKS=[
 {id:1,title:"Цели и результаты обучения",short:"Цели и результаты",
  focus:"Выяви расплывчатые, декларативные и неизмеримые формулировки. Предложи улучшенные формулировки через наблюдаемые действия.",
  q:["Насколько чётко сформулированы цели курса?","Соответствуют ли цели потребностям целевой аудитории?","Определены ли конкретные результаты обучения?","Можно ли проверить достижение каждого результата?","Соответствуют ли результаты уровню подготовки и продолжительности курса?","Есть ли связь с профессиональными или образовательными задачами обучающихся?"]},
 {id:2,title:"Структура и логика курса",short:"Структура и логика",
  focus:"Определи, какие темы переставить, объединить, разделить, сократить или дополнить. Проверь, формирует ли структура целостное понимание предмета, а не набор разрозненных тем.",
  q:["Последовательность модулей и тем обоснована","Есть переход от базовых знаний к сложным","Между разделами прослеживаются логические связи","Учтены необходимые предварительные знания","Отсутствуют повторы и дублирование содержания","Нет необоснованных пропусков","Объём содержания соответствует времени обучения"]},
 {id:3,title:"Баланс теории и практики",short:"Теория и практика",
  focus:"Не оценивай баланс только по количеству часов или заданий. Проверь, позволяет ли практика действительно сформировать заявленные умения. Проценты рассчитываются только по фактическим данным.",

 {id:4,title:"Задания и учебная деятельность",short:"Задания",

 {id:6,title:"Учебные материалы и ресурсы",short:"Материалы",

  q:["Учебных материалов достаточно","Материалы соответствуют уровню аудитории","Информация актуальна","Есть практические примеры","Объяснения доступны и понятны","Есть дополнительные источники и инструменты","Ресурсы соответствуют содержанию и целям курса"]},
 {id:7,title:"Профессиональная и практическая ценность",short:"Практическая ценность",
  focus:"Не приписывай курсу результаты, которые не подтверждаются его содержанием.",
  q:["Понятно, какие знания и умения студент сможет использовать после обучения","Содержание приближено к реальным профессиональным задачам","Есть связь теории и практики профессиональной деятельности","Формируются самостоятельность, аналитическое мышление, способность принимать решения","Определены элементы, требующие обновления с учётом изменений профессиональной среды"]},
 {id:8,title:"Целостность и методическая согласованность",short:"Согласованность",
  focus:"Сквозная проверка ЦЕЛЬ → РЕЗУЛЬТАТ → ТЕМА → ДЕЯТЕЛЬНОСТЬ → ОЦЕНИВАНИЕ. Для каждого результата заполни строку матрицы согласованности.",

];

const PRIO_DESC={"Критический":"мешает достижению целей курса","Высокий":"существенно снижает качество обучения","Средний":"требует планового улучшения","Низкий":"желательное усовершенствование"};
const STATES=["","Можно использовать в текущем виде","Требует точечной доработки","Требует существенной переработки","Не обеспечивает заявленные результаты"];
const DOC_KINDS=["Программа","Учебный план","Рабочая программа","Тематический план","Методические материалы","Задания","Оценочные средства","Другое"];
const BLOOM=[
 {lvl:"Запоминание",v:["перечислять","называть","воспроизводить","определять","узнавать"]},
 {lvl:"Понимание",v:["объяснять","интерпретировать","классифицировать","приводить примеры","обобщать"]},

 {re:/(^|[^а-яё])(знать|знание|знания|знаний)(?=[^а-яё]|$)/i,why:"«знать» не описывает наблюдаемое действие"},

function example(){

function merge(base,src){ // аккуратное восстановление сохранённых данных
  if(!src||typeof src!=="object")return base;
  for(const k in base){
    if(!(k in src))continue;
    if(base[k]&&typeof base[k]==="object"&&!Array.isArray(base[k])&&src[k]&&typeof src[k]==="object"&&!Array.isArray(src[k]))merge(base[k],src[k]);
    else base[k]=src[k];
  }
  return base;
}

function blockStat(id){
  const b=S.blocks[id];const ans=b.q.filter(x=>x.s).length;
  const numeric=typeof b.score==="number";
  const evOk=b.score===null||filled(b.evidence);
  return {ans,total:b.q.length,score:b.score,numeric,evOk};
}
function overall(){
  const vals=[],nd=[],none=[];
  BLOCKS.forEach(b=>{const v=S.blocks[b.id].score;if(typeof v==="number")vals.push(v);else if(v==="nd")nd.push(b.id);else none.push(b.id)});
  const avg=vals.length?vals.reduce((a,c)=>a+c,0)/vals.length:null;
  return {avg,n:vals.length,nd,none,min:vals.length?Math.min(...vals):null};
}
function matrixGaps(r){
  const g=[];if(!filled(r.topics))g.push("нет темы");if(!filled(r.tasks))g.push("нет задания");if(!filled(r.assess))g.push("нет способа оценки");
  if(r.time==="Недостаточно")g.push("недостаточно времени");return g;
}
function chain(){

function checks(){
  const out=[];const P=S.passport;
  const pl={name:"название курса",type:"тип программы",audience:"целевая аудитория",level:"уровень подготовки",duration:"продолжительность",format:"формат",purpose:"назначение аудита"};
  const miss=Object.keys(pl).filter(k=>!filled(P[k]));
  if(miss.length)out.push({l:"wrn",t:"В паспорте не указано "+miss.map(k=>pl[k]).join(", ")+". Выводы, зависящие от этих данных, ограничены.",go:"passport"});
  if(!S.docs.length)out.push({l:"err",t:"Не добавлено ни одного документа. Аудит без материалов невозможен, оценки будут ничем не подтверждены.",go:"docs"});
  S.docs.forEach(d=>{if(!filled(d.purpose)||!filled(d.relation))out.push({l:"wrn",t:"Для документа «"+(d.name||"без названия")+"» не установлено назначение или связь с другими документами.",go:"docs"})});
  BLOCKS.forEach(b=>{const B=S.blocks[b.id];
    if(typeof B.score==="number"&&!filled(B.evidence))out.push({l:"err",t:"Блок "+b.id+". Балл "+B.score+" поставлен без доказательства из материалов.",go:"block-"+b.id});
    if(B.score==="nd"&&!filled(B.evidence))out.push({l:"wrn",t:"Блок "+b.id+". Отметка Н/Д без указания, каких данных не хватает.",go:"block-"+b.id});
    if(B.score===null)out.push({l:"inf",t:"Блок "+b.id+" «"+b.short+"» пока не оценён.",go:"block-"+b.id});
    if(typeof B.score==="number"&&B.score>=4&&B.q.some(x=>x.s==="no"))out.push({l:"wrn",t:"Блок "+b.id+". Высокий балл при ответах «Нет» в контрольных вопросах. Проверьте согласованность оценки.",go:"block-"+b.id});
    if(typeof B.score==="number"&&B.score<=1&&B.q.length&&B.q.every(x=>x.s==="yes"))out.push({l:"wrn",t:"Блок "+b.id+". Низкий балл при положительных ответах на все вопросы.",go:"block-"+b.id});
  });
  const o=overall();if(o.nd.length)out.push({l:"inf",t:"Отметка Н/Д в блоках "+o.nd.join(", ")+". Общий балл в отчёте будет помечен как предварительный.",go:"overview"});
  S.problems.forEach(p=>{if(p.priority==="Критический"&&!filled(p.rec))out.push({l:"err",t:"Критическая проблема «"+(p.problem||"без описания")+"» не имеет рекомендации.",go:"problems"});
    if(filled(p.problem)&&!filled(p.where))out.push({l:"wrn",t:"Проблема «"+p.problem+"» не привязана к разделу документа.",go:"problems"})});
  if(!S.matrix.length)out.push({l:"wrn",t:"Матрица согласованности пуста. Блок 8 нельзя оценить обоснованно.",go:"matrix"});
  const gapRows=S.matrix.filter(r=>filled(r.lo)&&matrixGaps(r).length);
  if(gapRows.length)out.push({l:"wrn",t:"В матрице "+gapRows.length+" результат(а) с разрывом цепочки. Убедитесь, что они отражены в таблице проблем.",go:"matrix"});
  if(S.problems.some(p=>p.priority==="Критический")&&!S.plan.must.some(x=>filled(x.t)))out.push({l:"err",t:"Есть критические проблемы, но раздел «Обязательные изменения» пуст.",go:"plan"});
  const fq=Object.values(S.final).filter(filled).length;if(fq<5)out.push({l:"inf",t:"В финальном заключении заполнено "+fq+" из 5 ответов.",go:"final"});
  if(!filled(S.verdict.state))out.push({l:"inf",t:"Не выбрана общая оценка состояния программы.",go:"final"});
  const rank={err:0,wrn:1,inf:2};return out.sort((a,b)=>rank[a.l]-rank[b.l]);
}
function progress(){
  let tot=0,got=0;const add=(c)=>{tot++;if(c)got++};
  Object.values(S.passport).forEach(v=>add(filled(v)));
  add(S.docs.length>0);
  BLOCKS.forEach(b=>{const B=S.blocks[b.id];B.q.forEach(x=>add(!!x.s));add(B.score!==null);add(filled(B.evidence));add(filled(B.recs)||B.score==="nd")});
  add(S.problems.length>0);add(S.matrix.length>0);add(S.plan.must.length>0);
  ["summary","strengths","problems","state"].forEach(k=>add(filled(S.verdict[k])));
  Object.values(S.final).forEach(v=>add(filled(v)));
  return Math.round(got/tot*100);
}

function routeDot(id){

    docs:()=>S.docs.length?(S.docs.every(d=>filled(d.purpose))?"done":"part"):"warn",
    matrix:()=>S.matrix.length?(S.matrix.some(r=>matrixGaps(r).length)?"part":"done"):"",
    problems:()=>S.problems.some(p=>p.priority==="Критический"&&!filled(p.rec))?"warn":S.problems.length?"done":"",
    plan:()=>S.plan.must.length||S.plan.want.length?"done":"",structure:()=>S.structure.length?"done":"",

function arc(cx,cy,r,a0,a1){const p=a=>[cx+r*Math.cos(a),cy+r*Math.sin(a)];const [x0,y0]=p(a0),[x1,y1]=p(a1);return `M${x0.toFixed(2)} ${y0.toFixed(2)}A${r} ${r} 0 ${a1-a0>Math.PI?1:0} 1 ${x1.toFixed(2)} ${y1.toFixed(2)}`}

});

const ACCEPT=".docx,.pdf,.txt,.md,application/pdf,application/vnd.openxmlformats-officedocument.wordprocessingml.document,text/plain,text/markdown";
const LIBS={pdf:"https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js",pdfw:"https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js",docx:"https://cdnjs.cloudflare.com/ajax/libs/mammoth/1.6.0/mammoth.browser.min.js"};
const libP={};
function loadScript(u){return libP[u]||(libP[u]=new Promise((res,rej)=>{const el=document.createElement("script");el.src=u;el.async=true;el.onload=res;el.onerror=()=>{delete libP[u];el.remove();rej(new Error("Не удалось загрузить модуль чтения файлов. Проверьте подключение к интернету"))};document.head.appendChild(el)}))}
async function extractText(f){
  const ext=((f.name.match(/\.([^.]+)$/)||[])[1]||"").toLowerCase();
  if(f.size>25e6)throw new Error("Файл больше 25 МБ. Разделите его или вставьте нужные разделы вручную");
  if(["txt","md","csv"].includes(ext))return (await f.text()).trim();
  if(ext==="docx"){await loadScript(LIBS.docx);const r=await window.mammoth.extractRawText({arrayBuffer:await f.arrayBuffer()});
    const t=String(r.value||"").replace(/\n{3,}/g,"\n\n").trim();if(!t)throw new Error("В документе не найден текст");return t}
  if(ext==="pdf"){await loadScript(LIBS.pdfw);await loadScript(LIBS.pdf);const lib=window.pdfjsLib;
    const doc=await lib.getDocument({data:new Uint8Array(await f.arrayBuffer()),isEvalSupported:false,disableFontFace:true,verbosity:0}).promise;const pages=[];
    for(let i=1;i<=doc.numPages;i++){const pg=await doc.getPage(i);const tc=await pg.getTextContent();let t="";tc.items.forEach(it=>{t+=(it.str||"")+(it.hasEOL?"\n":"")});pages.push(t.replace(/[ \t]+\n/g,"\n").trim())}
    const t=pages.join("\n\n").trim();if(t.replace(/\s/g,"").length<20)throw new Error("В PDF нет текстового слоя, вероятно это скан. Вставьте текст вручную");return t}
  if(["doc","rtf","odt","pages"].includes(ext))throw new Error("Формат ."+ext+" не читается. Сохраните файл как .docx или PDF");
  throw new Error("Формат "+(ext?"."+ext:"файла")+" не поддерживается");
}
function guessKind(n){n=n.toLowerCase();

  if(/рабоч.*прог|рп[ _.-]/.test(n))return "Рабочая программа";if(/учебн.*план/.test(n))return "Учебный план";
  if(/метод|указан|практикум/.test(n))return "Методические материалы";if(/задан|кейс/.test(n))return "Задания";if(/программ/.test(n))return "Программа";return ""}

function loAnalysis(){
  const lines=String(S.loDraft||"").split(/\n+/).map(s=>s.trim()).filter(Boolean);
  if(!lines.length)return `<div class="card note box">Здесь появится разбор формулировок.</div>`;
  return lines.map(l=>{const bad=VAGUE.filter(v=>v.re.test(l));const low=l.toLowerCase();
    const lv=BLOOM.map((b,i)=>({i,lvl:b.lvl,hit:b.v.find(v=>low.includes(v.slice(0,Math.max(4,v.length-2))))})).filter(x=>x.hit);
    let html=esc(l);bad.forEach(v=>{html=html.replace(new RegExp(v.re.source,"i"),m=>`<mark>${m}</mark>`)});
    const cls=bad.length?"bad":lv.length?"good":"mid";
    const status=bad.length?"Неизмеримо":lv.length?"Наблюдаемо · "+lv.map(x=>x.lvl).join(", "):"Проверьте вручную";
    return `<div class="lo ${cls}"><div>${html}</div><span class="eyebrow" style="color:${bad.length?"var(--crit)":lv.length?"var(--ok)":"var(--warn)"}">${status}</span>
     <div class="s">${bad.length?bad.map(v=>v.why).join(". ")+". Возможные действия":lv.length?"Уточните объект, условия и критерий выполнения":"Глагол действия не распознан. Уточните, что делает обучающийся"}</div>
     ${bad.length?`<div class="verbs" style="grid-column:1/-1">${["объяснять","сравнивать","рассчитывать","применять","анализировать","аргументировать"].map(v=>`<button type="button" data-act="verb" data-v="${v}" data-l="${esc(l)}">${v}</button>`).join("")}</div>`:""}</div>`}).join("");
}

  R.push({h1:"Экспертный отчёт. Методический аудит курса"});

  R.push({h3:"Оценки по блокам"});
  R.push({table:["Блок","Балл","Доказательство","Источник"],rows:BLOCKS.map(b=>{const B=S.blocks[b.id];return [b.id+". "+b.title,B.score===null?"не оценён":scoreTxt(B.score),B.evidence,B.source]}),center:[1]});

  else if(o.nd.length||o.none.length)tot=`Предварительный средний балл ${fmt(o.avg)} рассчитан по ${o.n} из 8 блоков. ${o.nd.length?"Блоки "+o.nd.join(", ")+" отмечены Н/Д из-за недостатка информации. ":""}${o.none.length?"Блоки "+o.none.join(", ")+" не оценены. ":""}Использовать этот балл как итоговый некорректно.`;
  else tot=`Средний балл по восьми блокам ${fmt(o.avg)}, минимальный ${o.min}. Средний балл может скрывать критически слабые блоки, поэтому его следует читать вместе с таблицей проблем.`;
  R.push({p:tot});

  BLOCKS.forEach(b=>{const B=S.blocks[b.id];R.push({h3:"Блок "+b.id+". "+b.title+" · "+(B.score===null?"не оценён":scoreTxt(B.score))});
    const qa=b.q.map((q,i)=>B.q[i].s?q+". "+QS.find(x=>x[0]===B.q[i].s)[1]+(filled(B.q[i].n)?". "+B.q[i].n:""):null).filter(Boolean);
    if(qa.length)R.push({ul:qa});
    if(b.id===3){const h=B.hours;const nums=["theory","practice","self","control"].map(k=>parseFloat(String(h[k]).replace(",",".")));if(nums.every(n=>!isNaN(n))){const s=nums.reduce((a,c)=>a+c,0);if(s>0)R.push({p:`Распределение часов по документам. Теория ${h.theory} ч, практика ${h.practice} ч, самостоятельная работа ${h.self} ч, контроль ${h.control} ч (всего ${s}).`})}}
    R.push({p:filled(B.evidence)?"Доказательство. "+B.evidence+(filled(B.source)?" ("+B.source+")":""):null});
    if(filled(B.remarks))R.push({p:"Замечания. "+B.remarks});if(filled(B.recs))R.push({p:"Рекомендации. "+B.recs});});
  R.push({h2:"Раздел 3. Таблица проблем"});
  const ord=p=>{const i=PRIOS.indexOf(p.priority);return i<0?9:i};const pr=[...S.problems].sort((a,b)=>ord(a)-ord(b));

  R.push({h2:"Раздел 4. Матрица согласованности"});

  R.push({h2:"Раздел 7. Финальное заключение"});
  ["Можно ли использовать программу в текущем виде?","Какие три изменения наиболее важны?","Какие результаты обучения пока не обеспечены содержанием курса?","Что необходимо сделать в первую очередь?","Какой ожидаемый эффект дадут предлагаемые изменения?"].forEach((q,i)=>{R.push({h3:(i+1)+". "+q},{p:nv(S.final["q"+(i+1)])})});
  return R;
}
function radarSVG(){
  const W=580,H=400,cx=W/2,cy=H/2,R=130,N=8;const css=getComputedStyle(document.documentElement);const c=n=>css.getPropertyValue(n).trim();
  let s=`<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="Профиль оценок по блокам">`;
  for(let k=1;k<=5;k++){const pts=[];for(let i=0;i<N;i++){const a=-Math.PI/2+i*2*Math.PI/N;pts.push((cx+Math.cos(a)*R*k/5).toFixed(1)+","+(cy+Math.sin(a)*R*k/5).toFixed(1))}s+=`<polygon points="${pts.join(" ")}" fill="none" stroke="${c("--line")}" stroke-width="1"/>`;s+=`<text x="${cx+3}" y="${cy-R*k/5-2}" font-size="9" fill="${c("--faint")}" font-family="JetBrains Mono,monospace">${k}</text>`}
  BLOCKS.forEach((b,i)=>{const a=-Math.PI/2+i*2*Math.PI/N;const v=S.blocks[b.id].score;const x2=cx+Math.cos(a)*R,y2=cy+Math.sin(a)*R;
    s+=`<line x1="${cx}" y1="${cy}" x2="${x2}" y2="${y2}" stroke="${c("--line")}"/>`;
    const ca=Math.cos(a),lx=cx+ca*(R+16),ly=cy+Math.sin(a)*(R+18);const anc=ca>.3?"start":ca<-.3?"end":"middle";
    const words=(b.id+". "+b.short).split(" ");const lines=words.length>2?[words.slice(0,2).join(" "),words.slice(2).join(" ")]:[words.join(" ")];
    s+=`<text x="${lx.toFixed(1)}" y="${(ly-(lines.length-1)*6.5).toFixed(1)}" text-anchor="${anc}" dominant-baseline="middle" font-size="11.5" fill="${c("--muted")}" font-family="Golos Text,sans-serif">${lines.map((l,k)=>`<tspan x="${lx.toFixed(1)}" dy="${k?13:0}">${esc(l)}</tspan>`).join("")}</text>`;
    if(typeof v==="number"){const r=R*v/5;const col=c("--s"+v);s+=`<line x1="${cx}" y1="${cy}" x2="${cx+Math.cos(a)*r}" y2="${cy+Math.sin(a)*r}" stroke="${col}" stroke-width="4" stroke-linecap="round"/><circle cx="${cx+Math.cos(a)*r}" cy="${cy+Math.sin(a)*r}" r="7" fill="${col}"/><text x="${cx+Math.cos(a)*r}" y="${cy+Math.sin(a)*r+0.5}" text-anchor="middle" dominant-baseline="middle" font-size="9" fill="#fff" font-family="JetBrains Mono,monospace">${v}</text>`}
    else if(v==="nd"){s+=`<circle cx="${cx+Math.cos(a)*R*0.5}" cy="${cy+Math.sin(a)*R*0.5}" r="12" fill="${c("--surface")}" stroke="${c("--nd")}" stroke-dasharray="3 2"/><text x="${cx+Math.cos(a)*R*0.5}" y="${cy+Math.sin(a)*R*0.5+0.5}" text-anchor="middle" dominant-baseline="middle" font-size="8.5" fill="${c("--nd")}" font-family="JetBrains Mono,monospace">Н/Д</text>`}
  });
  return s+`<circle cx="${cx}" cy="${cy}" r="2.5" fill="${c("--ink")}"/></svg>`;
}
function toHTML(R){return R.map(n=>{
  if(n.h1)return `<h1>${esc(n.h1)}</h1>`;if(n.h2)return `<h2>${esc(n.h2)}</h2>`;if(n.h3)return `<h3>${esc(n.h3)}</h3>`;
  if("p" in n)return n.p===null?`<p class="empty-v">Не заполнено</p>`:String(n.p).split("\n").map(x=>`<p>${esc(x)}</p>`).join("");
  if(n.ul)return `<ul>${n.ul.map(x=>`<li>${esc(x)}</li>`).join("")}</ul>`;
  if(n.radar)return `<div class="radar">${radarSVG()}</div>`;
  if(n.table)return `<div class="tw"><table><thead><tr>${n.table.map(h=>`<th>${esc(h)}</th>`).join("")}</tr></thead><tbody>${n.rows.map(r=>`<tr>${r.map((c,i)=>`<td class="${(n.center||[]).includes(i)?"c":""}">${filled(c)?esc(c):'<span class="empty-v">·</span>'}</td>`).join("")}</tr>`).join("")}</tbody></table></div>`;
  return ""}).join("")}
function toMD(R){const cell=v=>String(filled(v)?v:"-").replace(/\|/g,"/").replace(/\n+/g," ");return R.map(n=>{
  if(n.h1)return "# "+n.h1;if(n.h2)return "## "+n.h2;if(n.h3)return "### "+n.h3;
  if("p" in n)return n.p===null?"_Не заполнено_":String(n.p).split("\n").join("  \n");
  if(n.ul)return n.ul.map(x=>"- "+x).join("\n");if(n.radar)return "";
  if(n.table)return "| "+n.table.join(" | ")+" |\n|"+n.table.map(()=>" --- ").join("|")+"|\n"+n.rows.map(r=>"| "+r.map(cell).join(" | ")+" |").join("\n");
  return ""}).filter(x=>x!=="").join("\n\n")}

1. РОЛЬ И ЗАДАЧА

Ты — независимый эксперт по проектированию образовательных программ, педагогический дизайнер и методист с опытом разработки и аудита программ профессионального образования.

Не ограничивайся описанием программы. Проверяй её внутреннюю логику, выявляй противоречия, пробелы и методические риски.
Работай как независимый эксперт, а не как автор, заинтересованный в положительной оценке собственной разработки.

3. НАПРАВЛЕНИЯ АУДИТА

БЛОК 1. ЦЕЛИ И РЕЗУЛЬТАТЫ ОБУЧЕНИЯ
Проверь:
- Насколько чётко сформулированы цели курса?
- Соответствуют ли они потребностям целевой аудитории?
- Определены ли конкретные результаты обучения?
- Можно ли проверить достижение каждого результата?
- Соответствуют ли результаты уровню подготовки и продолжительности курса?
- Есть ли связь с профессиональными или образовательными задачами обучающихся?
Выяви расплывчатые, декларативные и неизмеримые формулировки.
Предложи улучшенные формулировки результатов обучения с использованием наблюдаемых действий: объяснять, анализировать, рассчитывать, сравнивать, применять, аргументировать, разрабатывать и т. д.

БЛОК 2. СТРУКТУРА И ЛОГИКА КУРСА
Проанализируй:
- последовательность модулей и тем;
- переход от базовых знаний к сложным;
- логические связи между разделами;
- наличие необходимых предварительных знаний;
- повторы и дублирование содержания;
- необоснованные пропуски;
- соответствие объёма содержания времени обучения.
Определи, какие темы необходимо переставить, объединить, разделить, сократить или дополнить.
Проверь, формирует ли структура курса целостное понимание предмета, а не набор разрозненных тем.

БЛОК 3. БАЛАНС ТЕОРИИ И ПРАКТИКИ
Оцени:
- соотношение теоретических и практических занятий;
- наличие практического применения после изучения ключевых понятий;
- связь заданий с профессиональными или жизненными ситуациями;
- постепенное усложнение практических задач;
- достаточность самостоятельной работы;
- возможность переноса знаний в новые ситуации.
Не оценивай баланс только по количеству часов или заданий.
Проверь, позволяет ли практика действительно сформировать заявленные умения.
Если данных достаточно, представь распределение часов и содержания по видам деятельности. Если данных нет, не рассчитывай условные проценты.

БЛОК 4. ЗАДАНИЯ И УЧЕБНАЯ ДЕЯТЕЛЬНОСТЬ
Проанализируй:
- соответствие заданий результатам обучения;
- разнообразие форм учебной деятельности;
- уровень сложности;
- наличие индивидуальных и групповых заданий;
- проблемные, исследовательские и практико-ориентированные задачи;
- возможность самостоятельного принятия решений;
- наличие заданий на анализ, аргументацию и применение знаний.
Определи, какие задания недостаточно эффективны, повторяются или не имеют очевидной учебной цели.
Предложи конкретные новые задания с указанием:
1. Цели.
2. Условия выполнения.
3. Ожидаемого результата.
4. Проверяемого умения.

БЛОК 5. ОЦЕНИВАНИЕ И ОБРАТНАЯ СВЯЗЬ
Проверь:
- соответствие контрольных мероприятий результатам обучения;
- наличие входного, текущего и итогового контроля;
- разнообразие оценочных средств;
- понятность критериев оценивания;
- возможность объективно оценить практические умения;
- качество и своевременность обратной связи;
- наличие возможностей для исправления ошибок и повторного выполнения заданий.
Проверь, не подменяется ли оценка практических компетенций проверкой теоретических знаний.
При необходимости предложи новые критерии, рубрики, контрольные задания и способы оценивания.

БЛОК 6. УЧЕБНЫЕ МАТЕРИАЛЫ И РЕСУРСЫ
Оцени:
- достаточность учебных материалов;
- соответствие материалов уровню аудитории;
- актуальность информации;
- наличие практических примеров;
- доступность и понятность объяснений;
- наличие дополнительных источников и инструментов;
- соответствие ресурсов содержанию и целям курса.
Выяви, каких материалов не хватает для полноценного освоения программы.
Не предлагай ресурсы только ради увеличения их количества.

БЛОК 7. ПРОФЕССИОНАЛЬНАЯ И ПРАКТИЧЕСКАЯ ЦЕННОСТЬ
Определи:
- какие знания и умения студент сможет использовать после обучения;
- насколько содержание приближено к реальным профессиональным задачам;
- есть ли связь между теорией и практикой профессиональной деятельности;
- формируются ли самостоятельность, аналитическое мышление и способность принимать решения;
- какие элементы программы требуют обновления с учётом изменений профессиональной среды.
Не приписывай курсу результаты, которые не подтверждаются его содержанием.

БЛОК 8. ЦЕЛОСТНОСТЬ И МЕТОДИЧЕСКАЯ СОГЛАСОВАННОСТЬ
Проведи сквозную проверку:
ЦЕЛЬ → РЕЗУЛЬТАТ ОБУЧЕНИЯ → ТЕМА → УЧЕБНАЯ ДЕЯТЕЛЬНОСТЬ → ОЦЕНИВАНИЕ.
Для каждого заявленного результата проверь:
- где он формируется;
- какие задания помогают его достичь;
- каким способом проверяется;
- достаточно ли учебного времени для его освоения.
Представь выявленные несоответствия в отдельной таблице.

4. ИТОГОВАЯ ОЦЕНКА

Оцени каждый блок по шкале от 0 до 5:
0 — элемент отсутствует или не позволяет выполнить функцию.
1 — критически недостаточный уровень.
2 — имеются существенные недостатки.
3 — приемлемый уровень, но необходимы улучшения.
4 — хороший уровень с отдельными недочётами.
5 — высокий уровень, методически обоснованное решение.
Для каждого балла приведи доказательство из предоставленных материалов.
Если информации недостаточно, поставь отметку «Н/Д» вместо искусственной оценки.
Не рассчитывай общий балл по неполным данным без отдельного пояснения.

5. ФОРМАТ РЕЗУЛЬТАТА

Подготовь экспертный отчёт из следующих разделов.

Раздел 1. Общий вердикт
- Краткая характеристика курса.
- Основные достоинства.
- Главные методические проблемы.
- Общая оценка состояния программы.

Раздел 2. Детальный аудит
Представь результаты по восьми направлениям с конкретными замечаниями, обоснованиями и рекомендациями.

Раздел 3. Таблица проблем
| Проблема | Где обнаружена | Последствия | Приоритет | Рекомендация |
Приоритеты:
- Критический — мешает достижению целей курса.
- Высокий — существенно снижает качество обучения.
- Средний — требует планового улучшения.
- Низкий — желательное усовершенствование.

Раздел 4. Матрица согласованности
| Результат обучения | Темы | Практические задания | Способ оценки | Выявленный пробел |

Раздел 5. План улучшения программы
Раздели рекомендации на три группы:
1. Обязательные изменения — без них курс не обеспечивает заявленные результаты.
2. Желательные изменения — повышают качество и эффективность.
3. Дополнительные возможности — новые форматы, инструменты и методические решения.

Раздел 6. Предлагаемая структура обновлённого курса
Если выявлены существенные недостатки, предложи новую структуру:
- модули;
- темы;
- планируемые результаты;
- практические задания;
- способы оценки.
Не перестраивай программу без необходимости. Сохраняй сильные элементы исходного курса.

Раздел 7. Финальное заключение
Ответь на вопросы:
1. Можно ли использовать программу в текущем виде?
2. Какие три изменения наиболее важны?
3. Какие результаты обучения пока не обеспечены содержанием курса?
4. Что необходимо сделать в первую очередь?
5. Какой ожидаемый эффект дадут предлагаемые изменения?

6. ПРАВИЛА ЭКСПЕРТИЗЫ

- Будь объективным и требовательным.
- Не хвали программу без доказательств.
- Не выдумывай недостатки ради критики.
- Разделяй факты, экспертные выводы и предположения.
- Каждое существенное замечание привязывай к конкретному разделу документа.
- Не предлагай изменения, не связанные с целями курса.
- Учитывай уровень подготовки, формат и продолжительность обучения.
- Не заменяй профессиональную специфику общими педагогическими рекомендациями.
- Не переписывай всю программу, если достаточно точечных исправлений.

Главный критерий: программа должна обеспечивать реальное достижение заявленных результатов обучения, а не просто содержать определённое количество тем, лекций и заданий.

   el.onpointerdown=e=>{this.drag={x:e.clientX,y:e.clientY,ry:this.rotY,rx:this.rotX,moved:false};el.classList.add("drag");el.setPointerCapture(e.pointerId)};
   el.onpointermove=e=>{const r=el.getBoundingClientRect();this.ptr.set((e.clientX-r.left)/r.width*2-1,-(e.clientY-r.top)/r.height*2+1);
     if(this.drag){const dx=e.clientX-this.drag.x,dy=e.clientY-this.drag.y;if(Math.abs(dx)+Math.abs(dy)>4)this.drag.moved=true;this.rotY=this.drag.ry+dx*.008;this.rotX=Math.max(-.25,Math.min(.35,this.drag.rx+dy*.004))}};
   el.onpointerup=e=>{el.classList.remove("drag");const d=this.drag;this.drag=null;if(d&&!d.moved&&this.hover>=0)location.hash="block-"+(this.hover+1)};
   el.onpointerleave=()=>{this.ptr.set(9,9)};this.ptr.set(9,9);
   cancelAnimationFrame(this.raf);const loop=()=>{this.raf=requestAnimationFrame(loop);this.frame()};loop()},
 unmount(){cancelAnimationFrame(this.raf);if(this.ro)this.ro.disconnect();this.host=null},
 resize(){if(!this.host)return;const w=this.host.clientWidth,h=this.host.clientHeight;if(!w||!h)return;this.r.setSize(w,h,false);this.cam.aspect=w/h;this.cam.fov=w<520?46:36;this.cam.updateProjectionMatrix()},
 frame(){if(!this.host||!document.body.contains(this.host)){this.unmount();return}
   if(this.auto&&!this.drag&&this.hover<0)this.rotY+=.0022;this.group.rotation.y=this.rotY;this.group.rotation.x=this.rotX;
   this.bars.forEach(m=>{const u=m.userData;u.h+=(u.target-u.h)*.08;m.scale.y=u.h});
   this.ray.setFromCamera(this.ptr,this.cam);const hit=this.ray.intersectObjects(this.bars,false)[0];const hv=hit?hit.object.userData.i:-1;
   if(hv!==this.hover){this.hover=hv;this.bars.forEach((m,i)=>{m.material.emissive=i===hv?this.col("--accent").multiplyScalar(.35):new THREE.Color(0)});
     if(hv>=0){const b=BLOCKS[hv],B=S.blocks[b.id];this.tip.innerHTML=`<b>Блок ${b.id}. ${esc(b.title)}</b><br>${B.score===null?"Не оценён":scoreTxt(B.score)+". "+esc(SCALE[B.score])}`;this.tip.hidden=false}else this.tip.hidden=true}
   this.r.render(this.scene,this.cam);
   const w=this.host.clientWidth,h=this.host.clientHeight;const v=new THREE.Vector3();
   this.group.updateMatrixWorld();const P=[];this.bars.forEach((m,i)=>{v.set(m.position.x,m.userData.h+.22,m.position.z);this.group.localToWorld(v);
     const cv=v.clone().applyMatrix4(this.cam.matrixWorldInverse);v.project(this.cam);const L=this.labels[i];const B=S.blocks[BLOCKS[i].id];
     const t=`<b>${scoreTxt(B.score)}</b>блок ${BLOCKS[i].id}`;if(L._t!==t){L.innerHTML=t;L._t=t;L._w=L.offsetWidth;L._h=L.offsetHeight}
     P.push({i,L,x:(v.x+1)/2*w,y:(1-v.y)/2*h-8,d:-cv.z,w:(L._w||50)+6,h:(L._h||34)+4})});
   // раздвигаем подписи, ближние к зрителю остаются на месте
   const ord=[...P].sort((a,b)=>a.d-b.d);
   for(let it=0;it<4;it++)for(let a=0;a<ord.length;a++)for(let b=a+1;b<ord.length;b++){const A=ord[a],Bq=ord[b];
     const ox=Math.min(A.x+A.w/2,Bq.x+Bq.w/2)-Math.max(A.x-A.w/2,Bq.x-Bq.w/2),oy=Math.min(A.y,Bq.y)-Math.max(A.y-A.h,Bq.y-Bq.h);
     if(ox>0&&oy>0)Bq.y-=oy+1}
   const dmin=Math.min(...P.map(p=>p.d)),dmax=Math.max(...P.map(p=>p.d));
   P.forEach(p=>{const x=Math.max(p.w/2,Math.min(w-p.w/2,p.x)),y=Math.max(p.h,Math.min(h-30,p.y));
     p.L.style.transform=`translate(${(x-p.w/2+3).toFixed(1)}px,${(y-p.h+2).toFixed(1)}px)`;
     p.L.classList.toggle("hl",p.i===this.hover);p.L.classList.toggle("far",p.i!==this.hover&&dmax-dmin>.5&&p.d>dmin+(dmax-dmin)*.6)})}
};

/* ---------- рендер ---------- */
let lastRoute=null;
function render(){
  const id=current();const main=$("#main");
  main.innerHTML=`<div class="panel">${V[id]()}</div>`;
  if(id==="overview"){Scene.mount($("#stage"));bindTilt()}else Scene.unmount();
  if(id==="prompt")fillPrompt();
  derived();if(lastRoute!==id){window.scrollTo(0,0);lastRoute=id}
}
function fillPrompt(){const t=promptText();const o=$("#promptOut");if(o)o.textContent=t;const l=$("#pLen");if(l)l.textContent=t.length.toLocaleString("ru-RU")+" знаков"}
function bindTilt(){if(matchMedia("(prefers-reduced-motion: reduce)").matches)return;document.querySelectorAll(".tile").forEach(t=>{
  t.addEventListener("pointermove",e=>{const r=t.getBoundingClientRect();const x=(e.clientX-r.left)/r.width-.5,y=(e.clientY-r.top)/r.height-.5;t.style.setProperty("--ry",(x*8)+"deg");t.style.setProperty("--rx",(-y*8)+"deg")});
  t.addEventListener("pointerleave",()=>{t.style.setProperty("--ry","0deg");t.style.setProperty("--rx","0deg")})})}
function refreshLive(path){ // точечные обновления без потери фокуса
  const id=current();
  if(path.startsWith("matrix.")){const i=+path.split(".")[1];const r=S.matrix[i];if(r){const el=document.getElementById("gaps-"+r.id);if(el)el.innerHTML=gapChips(matrixGaps(r),r)}}
  if(path==="loDraft"){const o=$("#loOut");if(o)o.innerHTML=loAnalysis()}
  if(path.startsWith("blocks.3.hours")){const o=$("#hoursOut");if(o){const tmp=document.createElement("div");tmp.innerHTML=hoursView();o.innerHTML=tmp.querySelector("#hoursOut").innerHTML}}
  if(/^blocks\.\d+\.evidence$/.test(path)){const el=document.getElementById("f-"+path);const B=S.blocks[path.split(".")[1]];if(el)el.classList.toggle("need",B.score!==null&&!filled(el.value))}
  if(/^problems\.\d+\.priority$/.test(path)){const el=document.getElementById("f-"+path);if(el&&el.closest(".rec"))el.closest(".rec").dataset.p=el.value}
}
document.addEventListener("input",e=>{const t=e.target;if(t.dataset&&t.dataset.bind){setPath(t.dataset.bind,t.value);save();refreshLive(t.dataset.bind)}});
document.addEventListener("change",e=>{const t=e.target;
  if(t.dataset&&t.dataset.bind&&t.tagName==="SELECT"){setPath(t.dataset.bind,t.value);save();refreshLive(t.dataset.bind)}
  if(t.id==="withText"){withText=t.checked;fillPrompt()}
  if(t.dataset&&t.dataset.file!==undefined&&t.files[0]){const i=+t.dataset.file,f=t.files[0];toast("Извлекаю текст из «"+f.name+"»");
    extractText(f).then(txt=>{S.docs[i].text=txt;S.docs[i].file=f.name.split(".").pop().toUpperCase();if(!filled(S.docs[i].name))S.docs[i].name=f.name.replace(/\.[^.]+$/,"");save();render();toast("Текст документа загружен")}).catch(e=>toast(e.message||"Не удалось прочитать файл"))}
  if(t.id==="dropFile"&&t.files.length){addFiles(t.files);t.value=""}
  if(t.id==="importFile"&&t.files[0])readFile(t.files[0],txt=>doImport(txt));
});
function readFile(f,cb){if(f.size>25e6){toast("Файл больше 25 МБ");return}const r=new FileReader();r.onload=()=>cb(String(r.result));r.onerror=()=>toast("Не удалось прочитать файл");r.readAsText(f,"utf-8")}
function doImport(txt){try{const d=JSON.parse(txt);if(!d||!d.blocks||!d.passport)throw 0;S=merge(blank(),d);save();location.hash="overview";render();toast("Аудит восстановлен из копии")}catch(e){toast("Это не резервная копия аудита. Проверьте, что скопирован весь текст")}}
document.addEventListener("click",e=>{const b=e.target.closest("[data-act]");if(!b)return;const a=b.dataset.act;
  const re=()=>{save();render()};
  switch(a){
   case "q":{const B=S.blocks[b.dataset.b];const q=B.q[+b.dataset.i];q.s=q.s===b.dataset.v?"":b.dataset.v;save();
     b.parentElement.querySelectorAll("button").forEach(x=>{const on=x.dataset.v===q.s;x.classList.toggle("on",on);x.setAttribute("aria-pressed",on)});break}
   case "score":{const v=b.dataset.v;S.blocks[b.dataset.b].score=v==="clear"?null:v==="nd"?"nd":+v;re();break}
   case "add-doc":S.docs.push({id:uid(),name:"",kind:"",purpose:"",relation:"",text:"",file:""});re();break;
   case "add-problem":S.problems.push({id:uid(),problem:"",where:"",effect:"",priority:"",rec:""});re();break;
   case "add-matrix":S.matrix.push({id:uid(),lo:"",topics:"",tasks:"",assess:"",time:"",gap:""});re();break;
   case "add-task":S.tasks.push({id:uid(),goal:"",cond:"",result:"",skill:""});re();break;
   case "add-module":S.structure.push({id:uid(),module:"",topics:"",results:"",tasks:"",assess:"",keep:""});re();break;
   case "add-plan":S.plan[b.dataset.g].push({id:uid(),t:""});re();break;
   case "del":{const list=getPath(b.dataset.list);const i=findById(list,b.dataset.id);if(i>=0)list.splice(i,1);re();toast("Удалено");break}
   case "gaps2p":{let n=0;S.matrix.forEach(r=>{const g=matrixGaps(r);if(filled(r.lo)&&g.length){const txt="Разрыв цепочки для результата «"+r.lo+"» ("+g.join(", ")+")";if(!S.problems.some(p=>p.problem===txt)){S.problems.push({id:uid(),problem:txt,where:"Матрица согласованности",effect:"Достижение результата не обеспечено или не проверяется",priority:g.includes("нет способа оценки")?"Критический":"Высокий",rec:""});n++}}});re();toast(n?"Добавлено проблем: "+n:"Новых пробелов нет");break}
   case "p2plan":{let n=0;S.problems.forEach(p=>{if(!filled(p.rec))return;const g=p.priority==="Критический"?"must":p.priority==="Высокий"?"must":p.priority==="Средний"?"want":"extra";if(!S.plan[g].some(x=>x.t===p.rec)){S.plan[g].push({id:uid(),t:p.rec});n++}});re();toast(n?"Перенесено рекомендаций: "+n:"Новых рекомендаций нет");break}
   case "lo-matrix":{let n=0;String(S.loDraft||"").split(/\n+/).map(s=>s.trim()).filter(Boolean).forEach(l=>{if(!S.matrix.some(r=>r.lo===l)){S.matrix.push({id:uid(),lo:l,topics:"",tasks:"",assess:"",time:"",gap:""});n++}});save();toast(n?"В матрицу добавлено строк: "+n:"Все результаты уже есть в матрице");derived();break}
   case "verb":{const l=b.dataset.l,v=b.dataset.v;let nl=l;const ph=/иметь представлени[а-яё]*/i;
     if(ph.test(nl))nl=nl.replace(ph,v);else{const w=nl.split(/(\s+)/);for(let i=0;i<w.length;i++){if(VAGUE.some(x=>x.re.test(" "+w[i]+" "))){w[i]=v;break}}nl=w.join("")}
     nl=nl.charAt(0).toUpperCase()+nl.slice(1);S.loDraft=String(S.loDraft).split("\n").map(x=>x.trim()===l?nl:x).join("\n");const ta=document.getElementById("f-loDraft");if(ta)ta.value=S.loDraft;save();refreshLive("loDraft");toast("Черновик формулировки обновлён. Уточните объект и критерий");break}
   case "task2m":{const t=S.tasks.find(x=>x.id===b.dataset.id);const r=S.matrix.find(x=>x.lo.trim()===t.skill.trim());if(r){if(!r.tasks.includes(t.result||t.goal))r.tasks=[r.tasks,"Новое задание. "+(t.goal||t.result)].filter(filled).join("; ");toast("Задание связано с результатом в матрице")}else{S.matrix.push({id:uid(),lo:t.skill,topics:"",tasks:"Новое задание. "+(t.goal||t.result),assess:"",time:"",gap:""});toast("В матрицу добавлен новый результат")}save();break}
   case "copy-md":copy(toMD(reportModel()),"Отчёт скопирован в формате Markdown");break;
   case "copy-json":copy(JSON.stringify(S,null,1),"Резервная копия скопирована");break;
   case "copy-prompt":copy(promptText(),"Мастер-промпт скопирован");break;
   case "import":doImport(($("#importBox")||{}).value||"");break;
   case "example":S=example();re();toast("Загружен демонстрационный пример");break;
   case "start":S=blank();location.hash="passport";re();toast("Начат новый аудит");break;
   case "reset-ask":$("#confirmSlot").innerHTML=`<div class="confirm"><span>Все данные аудита в этом браузере будут удалены.</span><button class="btn danger sm" data-act="reset-yes">Удалить</button><button class="btn sm" data-act="reset-no">Отмена</button></div>`;break;
   case "reset-no":$("#confirmSlot").innerHTML="";break;
   case "reset-yes":S=blank();location.hash="overview";re();toast("Данные очищены");break;
  }
});
window.addEventListener("hashchange",render);
document.addEventListener("dragover",e=>{const d=e.target.closest&&e.target.closest("#drop");if(d||current()==="docs"){e.preventDefault();if(d)d.classList.add("over")}});
document.addEventListener("dragleave",e=>{const d=e.target.closest&&e.target.closest("#drop");if(d&&!d.contains(e.relatedTarget))d.classList.remove("over")});
document.addEventListener("drop",e=>{if(current()!=="docs")return;e.preventDefault();const d=$("#drop");if(d)d.classList.remove("over");if(e.dataTransfer&&e.dataTransfer.files.length)addFiles(e.dataTransfer.files)});
render();
})();
</script>
